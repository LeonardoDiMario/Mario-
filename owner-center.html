<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RubyChan Owner Center</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b0514;color:#f1f5f9;font-family:system-ui}.card{background:#180b28d9;backdrop-filter:blur(14px);border:1px solid #e11d4833}.btn{padding:.55rem .8rem;border-radius:12px;font-size:12px;font-weight:800}.on{background:#e11d48;color:#fff}.dark{background:#160b25;border:1px solid #3f244f;color:#cbd5e1}.inp{background:#12071f;border:1px solid #3f244f;color:#fff;border-radius:12px;padding:.65rem;width:100%}.modal{position:fixed;inset:0;background:#020008dd;display:grid;place-items:center;z-index:50;padding:16px}.modal>div{max-width:1000px;width:100%;max-height:90vh;overflow:auto}</style></head><body class="p-4 md:p-8"><main class="max-w-7xl mx-auto space-y-5"><header class="card rounded-2xl p-6 flex flex-wrap justify-between gap-3"><div><h1 class="text-2xl font-black text-rose-300">👑 RubyChan AI Owner Center</h1><p class="text-xs text-slate-400">Live Supabase Control • Chat History included</p></div><div class="flex gap-2 items-center"><span id="state" class="text-xs text-amber-300">● Locked</span><button class="btn dark" onclick="login()">Login</button><button class="btn dark" onclick="logout()">Logout</button></div></header><nav id="nav" class="flex flex-wrap gap-2 border-b border-rose-900/30 pb-3"></nav><section id="app"></section></main><div id="modal"></div><script>const BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';let key=sessionStorage.getItem('ruby_owner_key')||'',tab='stats';const T=[['stats','📊 Stats'],['users','👥 Users'],['characters','🎭 Characters'],['history','💬 Chat History'],['premium','👑 Premium'],['config','⚙️ Config']];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json','x-admin-key':key};const r=await fetch(BASE+p,o),d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function online(){$('state').textContent='● Online';$('state').className='text-xs text-emerald-300'}function login(){const p=prompt('Owner password');if(!p)return;fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})}).then(r=>r.json()).then(d=>{if(!d.success)throw Error('Invalid owner password');key=d.adminKey;sessionStorage.setItem('ruby_owner_key',key);online();render()}).catch(e=>alert(e.message))}function logout(){sessionStorage.removeItem('ruby_owner_key');location.reload()}function nav(){$('nav').innerHTML=T.map(x=>`<button class="btn ${tab===x[0]?'on':'dark'}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}function open(h){$('modal').innerHTML=`<div><div class="card rounded-2xl p-6">${h}</div></div>`}function close(){$('modal').innerHTML=''}async function render(){nav();$('app').innerHTML='<div class="card rounded-2xl p-8 text-center text-slate-400">Loading…</div>';try{if(tab==='stats')await stats();else if(tab==='users')await users();else if(tab==='characters')await chars();else if(tab==='history')await history();else if(tab==='premium')await premium();else await config()}catch(e){$('app').innerHTML=`<div class="card rounded-2xl p-6 text-red-300">${esc(e.message)}</div>`}}async function stats(){const d=await api('/stats'),s=d.stats;$('app').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="card rounded-2xl p-5">Users<h2 class="text-2xl font-black">${s.totalUsers}</h2></div><div class="card rounded-2xl p-5">Characters<h2 class="text-2xl font-black">${s.activeCharacters}</h2></div><div class="card rounded-2xl p-5">Conversations<h2 class="text-2xl font-black">${s.totalConversations}</h2></div><div class="card rounded-2xl p-5">Open Tickets<h2 class="text-2xl font-black">${s.openTickets}</h2></div></div>`}async function users(){const d=await api('/users?limit=200');$('app').innerHTML=`<div class="card rounded-2xl overflow-auto"><div class="p-4 font-bold">Users (${d.total||0})</div><table class="w-full text-xs"><thead><tr><th class="p-3 text-left">User</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Action</th></tr></thead><tbody>${(d.users||[]).map(u=>`<tr class="border-t border-rose-900/20"><td class="p-3">${esc(u.username||u.first_name||u.id)}<div class="text-[10px] text-slate-500">${esc(u.id)}</div></td><td>${esc(u.plan||'free')}</td><td>⚡${u.energy??0}</td><td>💎${u.gems??0}</td><td><button class="btn dark" onclick='editUser(${JSON.stringify(u)})'>Edit</button></td></tr>`).join('')}</tbody></table></div>`}function editUser(u){open(`<h2 class="text-xl font-black">Edit User</h2><div class="text-xs text-slate-400 mt-1">${esc(u.username||u.id)}</div><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="ed" class="inp" type="number" placeholder="Energy +/-"><input id="gd" class="inp" type="number" placeholder="Gems +/-"></div><button class="btn on mt-4" onclick="saveUser('${esc(u.id)}')">Save</button> <button class="btn dark mt-4" onclick="vip('${esc(u.id)}')">VIP</button> <button class="btn dark mt-4" onclick="close()">Close</button>`)}async function saveUser(id){await api('/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number($('ed').value||0),gemsDelta:Number($('gd').value||0)})});close();users()}async function vip(id){const action=prompt('grant or revoke','grant');if(!action)return;const days=prompt('VIP days','30');await api('/users/'+encodeURIComponent(id)+'/grant-vip',{method:'POST',body:JSON.stringify({action,planId:'1month',days:Number(days||30)})});alert('VIP updated')}async function chars(){const d=await api('/characters');$('app').innerHTML=`<div class="flex justify-between mb-3"><b>Characters (${(d.characters||[]).length})</b><button class="btn on" onclick="newChar()">+ New Character</button></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${(d.characters||[]).map(c=>`<div class="card rounded-2xl p-4"><div class="flex gap-3"><img src="${esc(c.avatar||'')}" class="w-14 h-14 rounded-2xl object-cover"><div><b>${esc(c.name)}</b><div class="text-xs text-rose-300">${esc(c.title||'')}</div></div></div><button class="btn dark mt-4" onclick='editChar(${JSON.stringify(c)})'>Edit</button></div>`).join('')}</div>`}function newChar(){editChar({})}function editChar(c){open(`<h2 class="text-xl font-black">${c.id?'Edit':'New'} Character</h2><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="cid" class="inp" placeholder="ID" value="${esc(c.id||'')}"><input id="cn" class="inp" placeholder="Name" value="${esc(c.name||'')}"><input id="ct" class="inp" placeholder="Title" value="${esc(c.title||'')}"><input id="ca" class="inp" placeholder="Avatar URL" value="${esc(c.avatar||'')}"></div><textarea id="cp" class="inp mt-3" rows="4" placeholder="Personality">${esc(c.personality||'')}</textarea><textarea id="cb" class="inp mt-3" rows="4" placeholder="Background">${esc(c.background||'')}</textarea><textarea id="cg" class="inp mt-3" rows="3" placeholder="Greeting">${esc(c.greeting||'')}</textarea><textarea id="cs" class="inp mt-3" rows="5" placeholder="System Prompt">${esc(c.system_prompt||'')}</textarea><button class="btn on mt-4" onclick="saveChar()">Save</button> <button class="btn dark mt-4" onclick="close()">Cancel</button>`)}async function saveChar(){await api('/characters',{method:'POST',body:JSON.stringify({id:$('cid').value||undefined,name:$('cn').value,title:$('ct').value,avatar:$('ca').value,personality:$('cp').value,background:$('cb').value,greeting:$('cg').value,systemPrompt:$('cs').value,isActive:true,isPremium:false})});close();chars()}async function history(){const d=await api('/chat-index');const rows=d.conversations||[];$('app').innerHTML=`<div class="card rounded-2xl p-4"><div class="flex justify-between"><b>Chat History (${rows.length})</b><button class="btn dark" onclick="history()">Refresh</button></div><div class="space-y-2 mt-4">${rows.map(c=>`<button class="w-full text-left p-3 bg-[#12071f] rounded-xl" onclick="showChat('${encodeURIComponent(c.user_id)}','${encodeURIComponent(c.character_id)}','${esc(c.character_id)}')"><b>👤 ${esc(c.user_id)}</b> → 🎭 ${esc(c.character_id)}<div class="text-[10px] text-slate-500">${esc(c.message_count)} messages • ${esc(c.updated_at||'')}</div></button>`).join('')||'<div class="text-slate-500">No chat messages found.</div>'}</div></div>`}async function showChat(uid,cid,title){const d=await api('/chat-logs/'+uid+'/'+cid);open(`<div class="flex justify-between"><div><h2 class="text-xl font-black">💬 ${title}</h2><p class="text-xs text-slate-500">User: ${esc(decodeURIComponent(uid))}</p></div><button class="btn dark" onclick="close()">Close</button></div><div class="space-y-3 mt-4">${(d.messages||[]).map(m=>`<div class="p-4 rounded-xl ${m.sender==='user'?'bg-purple-950/40':'bg-rose-950/30'}"><div class="text-[10px] text-slate-500">${esc(m.sender)} • ${esc(m.created_at||'')}</div><div class="mt-2 whitespace-pre-wrap">${esc(m.text||'')}</div>${m.image_url?`<img src="${esc(m.image_url)}" class="mt-3 rounded-xl max-h-96">`:''}</div>`).join('')||'<div class="text-slate-500">No messages</div>'}</div>`)}async function premium(){const d=await api('/premium');$('app').innerHTML=`<div class="card rounded-2xl p-4"><b>Premium / VIP</b><div class="space-y-2 mt-4">${(d.entitlements||[]).map(e=>`<div class="p-3 bg-[#12071f] rounded-xl text-xs">${esc(e.user_id)} • ${esc(e.plan_id)} • ${esc(e.status)} • ${esc(e.expiration_date||'')}</div>`).join('')}</div></div>`}async function config(){const d=await api('/config');$('app').innerHTML=`<div class="card rounded-2xl p-6"><b>System Config</b><div class="grid md:grid-cols-2 gap-3 mt-4">${Object.entries(d.config||{}).map(([k,v])=>`<div class="p-3 bg-[#12071f] rounded-xl"><div class="text-[10px] text-slate-500">${esc(k)}</div><div>${esc(v)}</div></div>`).join('')}</div></div>`}if(key)online();render();</script></body></html>
