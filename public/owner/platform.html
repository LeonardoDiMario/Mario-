<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RubyChan Owner Platform</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.hidden{display:none!important}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:230px;background:#0d0d10;border-right:1px solid #27272a;padding:14px}.main{margin-left:230px;min-height:100vh}.top{height:62px;border-bottom:1px solid #27272a;background:#09090b;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:10px;padding:10px 6px 20px;font-weight:800;font-size:18px}.nav{width:100%;border:0;background:none;color:#a1a1aa;padding:11px;border-radius:9px;text-align:left;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:#1a1a1f;color:#fff}.content{padding:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#111113;border:1px solid #27272a;border-radius:13px;padding:16px}.muted{color:#71717a;font-size:12px}.num{font-size:28px;font-weight:800;margin-top:7px}.btn{border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.btn:hover{background:#27272a}.primary{background:#7c3aed;border-color:#7c3aed}.danger{color:#fecdd3}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #222227;font-size:12px}.table th{color:#71717a;text-transform:uppercase;font-size:10px}.row{display:flex;gap:8px;align-items:center;justify-content:flex-end}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(860px,96vw);max-height:90vh;overflow:auto;background:#111113;border:1px solid #2a2a2f;border-radius:14px;padding:18px}.field{width:100%;padding:10px 11px;border-radius:8px;border:1px solid #3f3f46;background:#09090b;color:#fff;margin-top:8px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}@media(max-width:900px){.side{width:68px}.side .label{display:none}.main{margin-left:68px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="app hidden">
<aside class="side"><div class="brand">👑 <span class="label">RubyChan</span></div><div id="nav"></div><button id="logout" class="nav">↩ <span class="label">Logout</span></button></aside>
<main class="main"><header class="top"><div><b id="title">Overview</b><div class="muted">Owner management platform</div></div><button id="refresh" class="btn">↻</button></header><section id="content" class="content"></section></main>
</div><div id="modal"></div>
<script>
const API='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';let key=sessionStorage.getItem('ruby_owner_final')||'',page='overview',usersCache=[],charsCache=[];
const pages=[['overview','▦ Overview'],['users','👥 Users'],['characters','🤖 Characters'],['chats','💬 Chat History'],['premium','👑 Premium'],['logs','▤ Logs'],['support','◉ Support'],['config','⚙ Settings']];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json','x-admin-key':key};const r=await fetch(API+path,opts);const d=await r.json().catch(()=>({error:'Invalid response'}));if(r.status===401){sessionStorage.removeItem('ruby_owner_final');location.href='./';throw Error('Session expired')}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function nav(){$('nav').innerHTML=pages.map(([id,label])=>`<button class="nav ${page===id?'active':''}" data-page="${id}">${label}</button>`).join('')}
async function render(){nav();$('title').textContent=pages.find(p=>p[0]===page)[1].replace(/^\S+ /,'');$('content').innerHTML='<div class="card">Loading…</div>';try{await ({overview,users,characters,chats,premium,logs,support,config}[page])()}catch(e){$('content').innerHTML=`<div class="card" style="color:#fda4af">${esc(e.message)}</div>`}}
function stat(n,v){return `<div class="card"><div class="muted">${n}</div><div class="num">${esc(v)}</div></div>`}
async function overview(){const s=(await api('/stats')).stats||{};$('content').innerHTML=`<div class="grid">${stat('Users',s.totalUsers||0)}${stat('Characters',s.activeCharacters||0)}${stat('Chats',s.totalConversations||0)}${stat('Tickets',s.openTickets||0)}</div><div class="grid2" style="margin-top:12px"><div class="card"><b>Platform</b><p>⚡ ${s.totalEnergy||0} energy</p><p>💎 ${s.totalGems||0} gems</p></div><div class="card"><b>Quick Actions</b><div class="row" style="margin-top:12px;justify-content:flex-start"><button class="btn" data-page="users">Users</button><button class="btn" data-page="characters">Characters</button><button class="btn" data-page="chats">History</button></div></div></div>`}
async function users(){usersCache=(await api('/users?limit=200')).users||[];$('content').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Users</b><div class="muted">${usersCache.length} loaded</div></div><button class="btn" id="userRefresh">Refresh</button></div><div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>User</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Status</th><th></th></tr></thead><tbody>${usersCache.map((u,i)=>`<tr><td>${esc(u.first_name||u.username||'User')}<div class="muted">${esc(u.username||u.id)}</div></td><td>${esc(u.plan||'free')}</td><td>⚡${u.energy??0}</td><td>💎${u.gems??0}</td><td>${esc(u.status||'active')}</td><td class="row"><button class="btn" data-act="editUser" data-i="${i}">Edit</button><button class="btn" data-act="historyUser" data-i="${i}">History</button></td></tr>`).join('')}</tbody></table></div></div>`}
function modal(html){$('modal').innerHTML=`<div class="modal"><div class="modalbox">${html}</div></div>`}function closeModal(){$('modal').innerHTML=''}
function editUser(u){modal(`<h3>Edit User</h3><div class="muted">${esc(u.id)}</div><input id="ed" class="field" type="number" placeholder="Energy +/-"><input id="gd" class="field" type="number" placeholder="Gems +/-"><select id="st" class="field"><option>active</option><option>suspended</option><option>banned</option></select><div style="margin-top:12px"><button class="btn primary" id="saveUser">Save</button> <button class="btn" id="vipUser">Grant VIP</button> <button class="btn" id="close">Close</button></div>`);$('close').onclick=closeModal;$('saveUser').onclick=async()=>{await api('/users/'+encodeURIComponent(u.id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number($('ed').value||0),gemsDelta:Number($('gd').value||0)})});await api('/users/'+encodeURIComponent(u.id)+'/status',{method:'POST',body:JSON.stringify({status:$('st').value})});closeModal();users()};$('vipUser').onclick=async()=>{await api('/users/'+encodeURIComponent(u.id)+'/grant-vip',{method:'POST',body:JSON.stringify({action:'grant',planId:'1month',days:30})});closeModal();users()}}
async function historyUser(u){modal('<b>Chat History</b><div id="hist" class="muted">Loading…</div>');const rows=((await api('/chat-index')).conversations||[]).filter(x=>String(x.user_id)===String(u.id));$('hist').innerHTML=rows.map(x=>`<p><button class="btn" data-act="openChat" data-user="${esc(x.user_id)}" data-char="${esc(x.character_id)}">${esc(x.character_id)} · ${x.message_count||0} messages</button></p>`).join('')||'No messages'}
async function openChat(u,c){modal('<b>Conversation</b><div id="chat" class="muted">Loading…</div>');const rows=(await api('/chat-logs/'+encodeURIComponent(u)+'/'+encodeURIComponent(c))).messages||[];$('chat').innerHTML=rows.map(m=>`<div class="card" style="margin:8px 0"><div class="muted">${esc(m.sender)} · ${esc(m.created_at||'')}</div><div style="white-space:pre-wrap;margin-top:6px">${esc(m.text||'')}</div>${m.image_url?`<img src="${esc(m.image_url)}" style="max-width:100%;margin-top:8px;border-radius:8px">`:''}</div>`).join('')||'No messages'}
async function characters(){charsCache=(await api('/characters')).characters||[];$('content').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><b>Characters</b><div class="muted">${charsCache.length} records</div></div><button class="btn primary" data-act="newChar">New Character</button></div><div class="grid2">${charsCache.map((c,i)=>`<div class="card"><b>${esc(c.name)}</b><div style="color:#c4b5fd">${esc(c.title||'')}</div><p class="muted">${esc(c.personality||'')}</p><div class="row" style="justify-content:flex-start"><button class="btn" data-act="editChar" data-i="${i}">Edit</button><button class="btn" data-act="cloneChar" data-i="${i}">Clone</button><button class="btn danger" data-act="deleteChar" data-i="${i}">Delete</button></div></div>`).join('')}</div>`}
function charForm(c={}){modal(`<h3>${c.id?'Edit':'New'} Character</h3><input id="cn" class="field" placeholder="Name" value="${esc(c.name||'')}"><input id="ct" class="field" placeholder="Title" value="${esc(c.title||'')}"><input id="ca" class="field" placeholder="Avatar URL" value="${esc(c.avatar||'')}"><textarea id="cp" class="field" rows="4" placeholder="Personality">${esc(c.personality||'')}</textarea><textarea id="cb" class="field" rows="4" placeholder="Background">${esc(c.background||'')}</textarea><textarea id="cg" class="field" rows="3" placeholder="Greeting">${esc(c.greeting||'')}</textarea><textarea id="cs" class="field" rows="5" placeholder="System Prompt">${esc(c.system_prompt||'')}</textarea><div style="margin-top:12px"><button class="btn primary" id="saveChar">Save</button> <button class="btn" id="close">Close</button></div>`);$('close').onclick=closeModal;$('saveChar').onclick=async()=>{await api('/characters',{method:'POST',body:JSON.stringify({id:c.id||undefined,name:$('cn').value,title:$('ct').value,avatar:$('ca').value,personality:$('cp').value,background:$('cb').value,greeting:$('cg').value,systemPrompt:$('cs').value,isActive:true})});closeModal();characters()}}
async function chats(){const rows=(await api('/chat-index')).conversations||[];$('content').innerHTML=`<div class="card"><b>Chat History</b><div class="muted">${rows.length} threads</div><div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>User</th><th>Character</th><th>Messages</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td>${esc(x.character_id)}</td><td>${x.message_count||0}</td><td><button class="btn" data-act="openChat" data-user="${esc(x.user_id)}" data-char="${esc(x.character_id)}">Open</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function premium(){const rows=(await api('/premium')).entitlements||[];$('content').innerHTML=`<div class="card"><b>Premium</b><table class="table" style="margin-top:10px"><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td>${esc(x.plan_id)}</td><td>${esc(x.status)}</td><td>${esc(x.expiration_date||'')}</td></tr>`).join('')}</tbody></table></div>`}
async function logs(){const [a,e,g]=await Promise.all([api('/audit'),api('/logs/energy'),api('/logs/gems')]);$('content').innerHTML=`<div class="grid2"><div class="card"><b>Energy</b>${(e.logs||[]).slice(0,30).map(x=>`<p class="muted">${esc(x.user_id)} · ${esc(x.amount||'')}</p>`).join('')}</div><div class="card"><b>Gems</b>${(g.logs||[]).slice(0,30).map(x=>`<p class="muted">${esc(x.user_id)} · ${esc(x.amount||'')}</p>`).join('')}</div><div class="card"><b>Audit</b>${(a.auditLogs||[]).slice(0,30).map(x=>`<p class="muted">${esc(x.action||'')}</p>`).join('')}</div></div>`}
async function support(){const rows=(await api('/support')).tickets||[];$('content').innerHTML=`<div class="card"><b>Support</b>${rows.map(x=>`<p><b>${esc(x.subject||'Ticket')}</b> · ${esc(x.status||'open')}<br><span class="muted">${esc(x.message||'')}</span></p>`).join('')}</div>`}
async function config(){const c=(await api('/config')).config||{};$('content').innerHTML=`<div class="grid">${stat('Telegram',c.botUsername||'@Rubby_Chan_Bot')}${stat('AI',c.activeAiService||'Gemini')}${stat('Model',c.defaultModel||'Gemini')}</div>`}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;render()});document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b&&b.parentElement!==$('nav')){page=b.dataset.page;render();return}const a=e.target.closest('[data-act]');if(!a)return;const i=Number(a.dataset.i);if(a.dataset.act==='editUser')editUser(usersCache[i]);else if(a.dataset.act==='historyUser')historyUser(usersCache[i]);else if(a.dataset.act==='newChar')charForm();else if(a.dataset.act==='editChar')charForm(charsCache[i]);else if(a.dataset.act==='cloneChar')api('/characters/'+encodeURIComponent(charsCache[i].id)+'/duplicate',{method:'POST',body:'{}'}).then(characters);else if(a.dataset.act==='deleteChar'&&confirm('Delete character?'))api('/characters/'+encodeURIComponent(charsCache[i].id),{method:'DELETE'}).then(characters);else if(a.dataset.act==='openChat')openChat(a.dataset.user,a.dataset.char)});
$('logout').onclick=()=>{sessionStorage.removeItem('ruby_owner_final');location.href='./'};$('refresh').onclick=render;
if(!key){location.href='./'}else{$('app').classList.remove('hidden');render()}
</script>
</body>
</html>
