<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RubyChan Owner Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{color-scheme:dark}body{margin:0;background:#09090b;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{background:#111113;border:1px solid #27272a}.muted{color:#a1a1aa}.field{background:#09090b;border:1px solid #27272a;color:#fff;border-radius:8px;padding:9px 11px;width:100%;outline:none}.field:focus{border-color:#8b5cf6}.btn{border:1px solid #27272a;background:#18181b;color:#fafafa;border-radius:8px;padding:8px 11px;font-size:13px;font-weight:600}.btn:hover{background:#27272a}.primary{background:#7c3aed;border-color:#7c3aed}.primary:hover{background:#6d28d9}.danger{color:#fda4af;border-color:#4c1d25;background:#1f0b10}.nav{color:#a1a1aa;border-radius:8px;padding:9px 10px;display:flex;align-items:center;gap:10px;font-size:13px}.nav:hover{background:#18181b;color:#fff}.nav.active{background:#18181b;color:#fff}.pill{border:1px solid #27272a;background:#18181b;border-radius:999px;padding:3px 8px;font-size:11px}.table th{font-size:11px;color:#71717a;text-align:left;text-transform:uppercase;padding:11px;border-bottom:1px solid #27272a}.table td{padding:12px 11px;border-bottom:1px solid #1f1f22;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:100}.modalCard{width:min(860px,100%);max-height:90vh;overflow:auto;background:#111113;border:1px solid #27272a;border-radius:14px}.scroll{overflow:auto}.sidebar{width:240px}.hide{display:none}@media(max-width:900px){.sidebar{width:72px}.brandText,.navText{display:none}.nav{justify-content:center}.main{margin-left:72px!important}}
</style>
</head>
<body>
<div id="login" class="min-h-screen grid place-items-center p-6">
  <div class="card rounded-2xl p-7 w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6"><div class="w-10 h-10 rounded-xl bg-violet-600 grid place-items-center"><i data-lucide="crown"></i></div><div><div class="font-bold">RubyChan Owner</div><div class="text-xs muted">Secure Control Center</div></div></div>
    <input id="pass" class="field" type="password" placeholder="Owner password" />
    <button class="btn primary w-full mt-3" onclick="login()">Sign in</button>
    <div id="loginErr" class="text-xs text-rose-300 mt-3"></div>
  </div>
</div>
<div id="app" class="hide min-h-screen">
  <aside class="sidebar fixed inset-y-0 left-0 border-r border-zinc-800 bg-[#0c0c0f] p-3 z-40">
    <div class="flex items-center gap-3 px-2 py-3 mb-4"><div class="w-9 h-9 rounded-xl bg-violet-600 grid place-items-center shrink-0"><i data-lucide="crown" class="w-4 h-4"></i></div><div class="brandText"><div class="font-bold text-sm">RubyChan</div><div class="text-[10px] text-zinc-500">Owner Admin</div></div></div>
    <div class="space-y-1" id="nav"></div>
    <div class="absolute bottom-3 left-3 right-3"><button class="nav w-full" onclick="logout()"><i data-lucide="log-out" class="w-4 h-4"></i><span class="navText">Logout</span></button></div>
  </aside>
  <main class="main ml-[240px] min-h-screen">
    <header class="h-16 border-b border-zinc-800 flex items-center justify-between px-6 sticky top-0 bg-[#09090b] z-30"><div><div id="pageTitle" class="font-semibold text-sm">Overview</div><div class="text-[10px] text-zinc-500">Live RubyChan control center</div></div><div class="flex items-center gap-3"><span class="pill text-emerald-300">● Online</span><button class="btn" onclick="refresh()"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i></button></div></header>
    <section id="content" class="p-6 space-y-6"></section>
  </main>
</div>
<div id="modal"></div>
<script>
const BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';
let key=sessionStorage.getItem('ruby_owner_v2')||'';let current='overview';
const routes=[['overview','layout-dashboard','Overview'],['users','users','Users'],['characters','bot','Characters'],['chats','messages-square','Chat History'],['premium','crown','Premium'],['logs','scroll-text','Logs'],['support','life-buoy','Support'],['config','settings','Settings']];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json','x-admin-key':key};return fetch(BASE+path,opts).then(async r=>{const d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d})}
async function login(){const p=$('pass').value.trim();if(!p)return;$('loginErr').textContent='';try{const r=await fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})});const d=await r.json();if(!r.ok||!d.success)throw Error('Invalid owner password');key=d.adminKey;sessionStorage.setItem('ruby_owner_v2',key);showApp()}catch(e){$('loginErr').textContent=e.message}}
function showApp(){ $('login').classList.add('hide');$('app').classList.remove('hide');renderNav();render() }
function logout(){sessionStorage.removeItem('ruby_owner_v2');location.reload()}
function renderNav(){ $('nav').innerHTML=routes.map(([id,ic,label])=>`<button class="nav w-full ${current===id?'active':''}" onclick="current='${id}';render()"><i data-lucide="${ic}" class="w-4 h-4"></i><span class="navText">${label}</span></button>`).join('');lucide.createIcons() }
function refresh(){render()}
function render(){renderNav();$('pageTitle').textContent=routes.find(x=>x[0]===current)[2];$('content').innerHTML='<div class="card rounded-2xl p-10 text-center text-zinc-500">Loading…</div>';const f={overview,users,characters,chats,premium,logs,support,config}[current];f().catch(e=>{$('content').innerHTML=`<div class="card rounded-2xl p-5 text-rose-300">${esc(e.message)}</div>`})}
function stat(title,value,note,icon){return `<div class="card rounded-2xl p-5"><div class="flex items-center justify-between"><div class="text-xs text-zinc-500">${title}</div><div class="w-8 h-8 rounded-lg bg-zinc-900 grid place-items-center text-violet-300"><i data-lucide="${icon}" class="w-4 h-4"></i></div></div><div class="text-2xl font-bold mt-3">${esc(value)}</div><div class="text-[10px] text-zinc-500 mt-1">${note}</div></div>`}
async function overview(){const d=await api('/stats'),s=d.stats||{};$('content').innerHTML=`<div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${stat('Total users',s.totalUsers||0,'Registered accounts','users')}${stat('Characters',s.activeCharacters||0,'Active characters','bot')}${stat('Conversations',s.totalConversations||0,'Chat threads','messages-square')}${stat('Open tickets',s.openTickets||0,'Support queue','life-buoy')}</div><div class="grid lg:grid-cols-3 gap-4"><div class="card rounded-2xl p-5 lg:col-span-2"><div class="flex justify-between"><div><div class="font-semibold text-sm">Platform</div><div class="text-xs text-zinc-500">RubyChan live telemetry</div></div><span class="pill text-emerald-300">Healthy</span></div><div class="grid grid-cols-2 gap-3 mt-5"><div class="rounded-xl bg-zinc-950 p-4"><div class="text-[10px] text-zinc-500">Tracked Energy</div><div class="text-xl font-bold mt-1">⚡ ${esc(s.totalEnergy||0)}</div></div><div class="rounded-xl bg-zinc-950 p-4"><div class="text-[10px] text-zinc-500">Tracked Gems</div><div class="text-xl font-bold mt-1">💎 ${esc(s.totalGems||0)}</div></div></div></div><div class="card rounded-2xl p-5"><div class="font-semibold text-sm">Quick Actions</div><div class="space-y-2 mt-4"><button class="btn w-full text-left" onclick="current='users';render()">Manage users</button><button class="btn w-full text-left" onclick="current='characters';render()">Manage characters</button><button class="btn w-full text-left" onclick="current='chats';render()">Open chat history</button></div></div></div>`;lucide.createIcons()}
async function users(){const d=await api('/users?limit=200');const rows=d.users||[];$('content').innerHTML=`<div class="card rounded-2xl overflow-hidden"><div class="p-4 border-b border-zinc-800 flex flex-wrap justify-between gap-3"><div><div class="font-semibold text-sm">Users</div><div class="text-xs text-zinc-500">${rows.length} loaded</div></div><input id="uq" class="field max-w-xs" placeholder="Search" onkeydown="if(event.key==='Enter')searchUsers()"></div><div class="scroll"><table class="table w-full"><thead><tr><th>User</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr><td><div class="font-semibold">${esc(u.first_name||u.username||'User')}</div><div class="text-[10px] text-zinc-500">${esc(u.username||u.id)}</div></td><td>${esc(u.plan||'free')}</td><td>⚡ ${u.energy??0}</td><td>💎 ${u.gems??0}</td><td><span class="pill">${esc(u.status||'active')}</span></td><td class="text-right"><button class="btn" onclick='editUser(${JSON.stringify(u)})'>Edit</button> <button class="btn" onclick='userHistory(${JSON.stringify(u)})'>History</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function searchUsers(){const q=$('uq').value;const d=await api('/users?limit=200&q='+encodeURIComponent(q));const rows=d.users||[];$('content').innerHTML=`<div class="card rounded-2xl p-5"><button class="btn" onclick="users()">Back</button><div class="text-sm font-semibold mt-4">${rows.length} results</div><div class="scroll mt-3"><table class="table w-full"><tbody>${rows.map(u=>`<tr><td>${esc(u.first_name||u.username||u.id)}</td><td>${esc(u.plan||'free')}</td><td>⚡${u.energy??0}</td><td>💎${u.gems??0}</td><td><button class="btn" onclick='editUser(${JSON.stringify(u)})'>Edit</button> <button class="btn" onclick='userHistory(${JSON.stringify(u)})'>History</button></td></tr>`).join('')}</tbody></table></div></div>`}
function modal(html){$('modal').innerHTML=`<div class="modal"><div class="modalCard p-5">${html}</div></div>`}
function closeModal(){$('modal').innerHTML=''}
function editUser(u){modal(`<div class="flex justify-between"><div><div class="text-lg font-bold">Edit User</div><div class="text-xs text-zinc-500">${esc(u.id)}</div></div><button class="btn" onclick="closeModal()">Close</button></div><div class="grid md:grid-cols-2 gap-3 mt-5"><input id="ed" class="field" type="number" value="0" placeholder="Energy +/-"><input id="gd" class="field" type="number" value="0" placeholder="Gems +/-"></div><select id="st" class="field mt-3"><option>active</option><option>suspended</option><option>banned</option></select><div class="flex gap-2 mt-4"><button class="btn primary" onclick="saveUser('${esc(u.id)}')">Save</button><button class="btn" onclick="grantVip('${esc(u.id)}')">Grant VIP</button></div>`)}
async function saveUser(id){await api('/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number($('ed').value||0),gemsDelta:Number($('gd').value||0)})});await api('/users/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:$('st').value})});closeModal();users()}
async function grantVip(id){const action=confirm('Grant VIP?')?'grant':'revoke';const days=Number(prompt('VIP days','30')||30);await api('/users/'+encodeURIComponent(id)+'/grant-vip',{method:'POST',body:JSON.stringify({action,planId:'1month',days})});closeModal();users()}
async function userHistory(u){modal('<div class="text-zinc-500">Loading chat history…</div>');const d=await api('/chat-index');const rows=(d.conversations||[]).filter(x=>String(x.user_id)===String(u.id));modal(`<div class="flex justify-between"><div><div class="text-lg font-bold">${esc(u.first_name||u.username||u.id)}</div><div class="text-xs text-zinc-500">Chat history</div></div><button class="btn" onclick="closeModal()">Close</button></div><div class="space-y-2 mt-5">${rows.map(x=>`<button class="card w-full text-left p-4 rounded-xl" onclick="viewChat('${encodeURIComponent(x.user_id)}','${encodeURIComponent(x.character_id)}','${esc(x.character_id)}')"><div class="font-semibold">${esc(x.character_id)}</div><div class="text-[10px] text-zinc-500">${x.message_count||0} messages</div></button>`).join('')||'<div class="text-zinc-500 text-sm">No messages found.</div>'}</div>`)}
async function viewChat(uid,cid,title){const d=await api('/chat-logs/'+uid+'/'+cid);modal(`<div class="flex justify-between"><div><div class="text-lg font-bold">${title}</div><div class="text-xs text-zinc-500">Full conversation</div></div><button class="btn" onclick="closeModal()">Close</button></div><div class="space-y-3 mt-5">${(d.messages||[]).map(m=>`<div class="rounded-xl bg-zinc-950 p-4"><div class="text-[10px] text-zinc-500">${esc(m.sender)} · ${esc(m.created_at||'')}</div><div class="text-sm mt-2 whitespace-pre-wrap">${esc(m.text||'')}</div>${m.image_url?`<img class="mt-3 rounded-lg max-h-80" src="${esc(m.image_url)}" />`:''}</div>`).join('')||'<div class="text-zinc-500">No messages.</div>'}</div>`)}
async function characters(){const d=await api('/characters'),rows=d.characters||[];$('content').innerHTML=`<div class="flex justify-between items-center"><div><div class="font-semibold text-sm">Characters</div><div class="text-xs text-zinc-500">${rows.length} active records</div></div><button class="btn primary" onclick="charForm()">New character</button></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${rows.map(c=>`<div class="card rounded-2xl p-4"><div class="flex gap-3"><img class="w-14 h-14 rounded-xl object-cover bg-zinc-900" src="${esc(c.avatar||'')}" onerror="this.style.opacity=.2"><div><div class="font-semibold">${esc(c.name)}</div><div class="text-xs text-violet-300">${esc(c.title||'')}</div></div></div><div class="text-xs text-zinc-500 mt-3 line-clamp-3">${esc(c.personality||'')}</div><div class="flex gap-2 mt-4"><button class="btn" onclick='charForm(${JSON.stringify(c)})'>Edit</button><button class="btn" onclick='cloneChar(${JSON.stringify(c.id)})'>Clone</button><button class="btn danger" onclick='deleteChar(${JSON.stringify(c.id)})'>Delete</button></div></div>`).join('')}</div>`}
function charForm(c={}){modal(`<div class="text-lg font-bold">${c.id?'Edit':'Create'} Character</div><div class="grid md:grid-cols-2 gap-3 mt-5"><input id="cid" class="field" placeholder="ID" value="${esc(c.id||'')}"><input id="cn" class="field" placeholder="Name" value="${esc(c.name||'')}"><input id="ct" class="field" placeholder="Title" value="${esc(c.title||'')}"><input id="ca" class="field" placeholder="Avatar URL" value="${esc(c.avatar||'')}"></div><textarea id="cp" class="field mt-3" rows="4" placeholder="Personality">${esc(c.personality||'')}</textarea><textarea id="cb" class="field mt-3" rows="4" placeholder="Background">${esc(c.background||'')}</textarea><textarea id="cg" class="field mt-3" rows="3" placeholder="Greeting">${esc(c.greeting||'')}</textarea><textarea id="cs" class="field mt-3" rows="5" placeholder="System Prompt">${esc(c.system_prompt||'')}</textarea><div class="flex gap-2 mt-4"><button class="btn primary" onclick="saveChar('${esc(c.id||'')}')">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
async function saveChar(id){const p={id:$('cid').value||undefined,name:$('cn').value,title:$('ct').value,avatar:$('ca').value,personality:$('cp').value,background:$('cb').value,greeting:$('cg').value,systemPrompt:$('cs').value,isActive:true};if(id){await api('/characters/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(p)})}else{await api('/characters',{method:'POST',body:JSON.stringify(p)})}closeModal();characters()}
async function cloneChar(id){await api('/characters/'+encodeURIComponent(id)+'/duplicate',{method:'POST',body:'{}'});characters()}
async function deleteChar(id){if(!confirm('Delete character?'))return;await api('/characters/'+encodeURIComponent(id),{method:'DELETE'});characters()}
async function chats(){const d=await api('/chat-index'),rows=d.conversations||[];$('content').innerHTML=`<div class="card rounded-2xl overflow-hidden"><div class="p-4 border-b border-zinc-800"><div class="font-semibold text-sm">Chat History</div><div class="text-xs text-zinc-500">All user / character threads</div></div><div class="scroll"><table class="table w-full"><thead><tr><th>User</th><th>Character</th><th>Messages</th><th>Updated</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td>${esc(x.character_id)}</td><td>${esc(x.message_count)}</td><td>${esc(x.updated_at||'')}</td><td><button class="btn" onclick="viewChat('${encodeURIComponent(x.user_id)}','${encodeURIComponent(x.character_id)}','${esc(x.character_id)}')">Open</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function premium(){const d=await api('/premium');const rows=d.entitlements||[];$('content').innerHTML=`<div class="card rounded-2xl overflow-hidden"><div class="p-4 border-b border-zinc-800"><div class="font-semibold text-sm">Premium Entitlements</div></div><div class="scroll"><table class="table w-full"><thead><tr><th>User</th><th>Plan</th><th>Status</th><th>Expires</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td>${esc(x.plan_id)}</td><td>${esc(x.status)}</td><td>${esc(x.expiration_date||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function logs(){const [a,b,c]=await Promise.all([api('/logs/energy'),api('/logs/gems'),api('/audit')]);$('content').innerHTML=`<div class="grid lg:grid-cols-3 gap-4">${logCard('Energy',a.logs||[],'amount')}${logCard('Gems',b.logs||[],'amount')}${logCard('Audit',c.auditLogs||[],'action')}</div>`}
function logCard(title,rows,key){return `<div class="card rounded-2xl p-4"><div class="font-semibold text-sm">${title}</div><div class="space-y-2 mt-4">${rows.slice(0,40).map(x=>`<div class="border-b border-zinc-800 pb-2"><div class="text-[11px]">${esc(x.user_id||x.target_id||'')}</div><div class="text-[10px] text-zinc-500">${esc(x[key]||'')} · ${esc(x.created_at||'')}</div></div>`).join('')}</div></div>`}
async function support(){const d=await api('/support');const rows=d.tickets||[];$('content').innerHTML=`<div class="card rounded-2xl overflow-hidden"><div class="p-4 border-b border-zinc-800"><div class="font-semibold text-sm">Support</div></div><div class="scroll"><table class="table w-full"><thead><tr><th>Subject</th><th>Message</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.subject||'Support')}</td><td>${esc(x.message||'')}</td><td>${esc(x.status||'open')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function config(){const d=await api('/config');const c=d.config||{};$('content').innerHTML=`<div class="grid md:grid-cols-2 gap-4"><div class="card rounded-2xl p-5"><div class="font-semibold text-sm">Telegram</div><div class="text-sm mt-3">${esc(c.botUsername||'@Rubby_Chan_Bot')}</div></div><div class="card rounded-2xl p-5"><div class="font-semibold text-sm">AI Engine</div><div class="text-sm mt-3">${esc(c.activeAiService||'Google Gemini')}</div></div><div class="card rounded-2xl p-5"><div class="font-semibold text-sm">Default Model</div><div class="text-sm mt-3">${esc(c.defaultModel||'Gemini')}</div></div></div>`}
if(key){showApp()}else{lucide.createIcons()}
</script>
</body></html>
