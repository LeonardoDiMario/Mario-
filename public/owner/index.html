<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RubyChan Owner Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#09090b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}.card{width:min(420px,92vw);background:#111113;border:1px solid #2a2a2f;border-radius:16px;padding:28px;box-shadow:0 20px 60px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:12px;background:#7c3aed;display:grid;place-items:center;font-size:22px}.muted{color:#71717a;font-size:13px}.field{width:100%;padding:12px 13px;border-radius:9px;border:1px solid #3f3f46;background:#18181b;color:#fff;outline:none;margin-top:10px}.field:focus{border-color:#8b5cf6}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.btn:hover{background:#6d28d9}.err{color:#fda4af;font-size:13px;min-height:20px;margin-top:9px}.note{margin-top:16px;padding:10px 12px;border:1px solid #27272a;border-radius:10px;background:#0d0d10;color:#a1a1aa;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">👑</div><div><div style="font-size:20px;font-weight:800">RubyChan Owner</div><div class="muted">Secure Control Center</div></div></div>
  <input id="pass" class="field" type="password" placeholder="Owner password" autocomplete="current-password">
  <button id="sign" class="btn">Sign in</button>
  <div id="err" class="err"></div>
  <div class="note">The management platform opens only after successful sign in.</div>
</div>
<script>
const API='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';
const pass=document.getElementById('pass'),sign=document.getElementById('sign'),err=document.getElementById('err');
async function login(){const p=pass.value.trim();if(!p){err.textContent='Enter owner password.';return}sign.disabled=true;sign.textContent='Signing in…';err.textContent='';try{const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'Invalid owner password');sessionStorage.setItem('ruby_owner_final',d.adminKey);location.href='./platform.html'}catch(e){err.textContent=e.message}finally{sign.disabled=false;sign.textContent='Sign in'}}
sign.addEventListener('click',login);pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
