<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RubyChan Owner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:#09090b}.login-card{width:min(410px,92vw);background:#111113;border:1px solid #27272a;border-radius:16px;padding:28px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.muted{color:#71717a;font-size:12px}.field{width:100%;background:#18181b;color:#fff;border:1px solid #3f3f46;border-radius:9px;padding:11px 12px;outline:none}.field:focus{border-color:#7c3aed}.btn{background:#18181b;color:#fff;border:1px solid #3f3f46;border-radius:9px;padding:9px 12px;cursor:pointer}.btn:hover{background:#242428}.primary{background:#7c3aed;border-color:#7c3aed}.danger{color:#fecdd3}.layout{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:242px;background:#0d0d10;border-right:1px solid #27272a;padding:16px}.main{margin-left:242px;min-height:100vh;flex:1}.top{height:64px;border-bottom:1px solid #27272a;background:#09090b;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:2}.nav{width:100%;text-align:left;border:0;background:transparent;color:#a1a1aa;padding:11px 12px;border-radius:9px;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:#1a1a1f;color:#fff}.content{padding:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#111113;border:1px solid #27272a;border-radius:14px;padding:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #222227;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}.modal-box{width:min(820px,96vw);max-height:90vh;overflow:auto;background:#111113;border:1px solid #27272a;border-radius:14px;padding:18px}.pill{display:inline-block;border:1px solid #3f3f46;border-radius:999px;padding:3px 8px;font-size:11px}.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:900px){.side{width:72px}.side .label{display:none}.main{margin-left:72px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cards2{grid-template-columns:1fr}}@media(max-width:540px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="brand">👑 RubyChan Owner</div>
    <div class="muted" style="margin-top:6px">Secure Control Center</div>
    <input id="password" class="field" type="password" placeholder="Owner password" style="margin-top:20px">
    <button id="signIn" class="btn primary" style="width:100%;margin-top:10px">Sign in</button>
    <div id="loginError" style="color:#fda4af;margin-top:8px"></div>
  </div>
</div>
<div id="appView" class="layout">
  <aside class="side">
    <div class="brand" style="font-size:18px;margin:6px 4px 20px">👑 <span class="label">RubyChan</span></div>
    <div id="nav"></div>
    <button id="logout" class="nav">↩ <span class="label">Logout</span></button>
  </aside>
  <main class="main">
    <header class="top"><div><b id="title">Overview</b><div class="muted">Live owner control center</div></div><button id="refresh" class="btn">↻ Refresh</button></header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modal"></div>
<script>
const API='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';
let adminKey=sessionStorage.getItem('ruby_owner_fixed')||'';let current='overview';let usersCache=[];let charsCache=[];
const pages=[['overview','▦ Overview'],['users','👥 Users'],['characters','🤖 Characters'],['chats','💬 Chat History'],['premium','👑 Premium'],['logs','▤ Logs'],['support','◉ Support'],['config','⚙ Settings']];
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json','x-admin-key':adminKey};const r=await fetch(API+path,opts);const d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function showApp(){ $('loginView').style.display='none'; $('appView').style.display='flex'; render(); }
function logout(){sessionStorage.removeItem('ruby_owner_fixed');location.reload()}
async function login(){const pass=$('password').value.trim();if(!pass)return;$('loginError').textContent='';try{const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:pass})});const d=await r.json();if(!r.ok||!d.success)throw Error('Invalid owner password');adminKey=d.adminKey;sessionStorage.setItem('ruby_owner_fixed',adminKey);showApp()}catch(e){$('loginError').textContent=e.message}}
function renderNav(){$('nav').innerHTML=pages.map(([id,label])=>`<button class="nav ${current===id?'active':''}" data-page="${id}">${label}</button>`).join('')}
async function render(){renderNav();$('title').textContent=pages.find(p=>p[0]===current)?.[1].replace(/^\S+ /,'')||'Overview';$('content').innerHTML='<div class="card">Loading…</div>';try{await ({overview,users,characters,chats,premium,logs,support,config}[current]||overview)()}catch(e){$('content').innerHTML=`<div class="card" style="color:#fda4af">${esc(e.message)}</div>`}}
function stat(label,value){return `<div class="card"><div class="muted">${label}</div><div style="font-size:28px;font-weight:800;margin-top:8px">${esc(value)}</div></div>`}
async function overview(){const s=(await api('/stats')).stats||{};$('content').innerHTML=`<div class="grid">${stat('Users',s.totalUsers||0)}${stat('Characters',s.activeCharacters||0)}${stat('Chats',s.totalConversations||0)}${stat('Tickets',s.openTickets||0)}</div><div class="cards2" style="margin-top:12px"><div class="card"><b>Platform</b><p>⚡ ${s.totalEnergy||0} energy</p><p>💎 ${s.totalGems||0} gems</p></div><div class="card"><b>Quick Actions</b><div style="margin-top:12px"><button class="btn" data-page="users">Users</button> <button class="btn" data-page="characters">Characters</button> <button class="btn" data-page="chats">History</button></div></div></div>`}
async function users(){usersCache=(await api('/users?limit=200')).users||[];$('content').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><div><b>Users</b><div class="muted">${usersCache.length} loaded</div></div><button class="btn" id="reloadUsers">Refresh</button></div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>User</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Status</th><th>Actions</th></tr></thead><tbody>${usersCache.map((u,i)=>`<tr><td><b>${esc(u.first_name||u.username||'User')}</b><div class="muted">${esc(u.username||u.id)}</div></td><td>${esc(u.plan||'free')}</td><td>⚡${u.energy??0}</td><td>💎${u.gems??0}</td><td><span class="pill">${esc(u.status||'active')}</span></td><td><button class="btn" data-action="editUser" data-i="${i}">Edit</button> <button class="btn" data-action="historyUser" data-i="${i}">History</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function characters(){charsCache=(await api('/characters')).characters||[];$('content').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><b>Characters</b><div class="muted">${charsCache.length} records</div></div><button class="btn primary" data-action="newChar">New Character</button></div><div class="grid">${charsCache.map((c,i)=>`<div class="card"><b>${esc(c.name)}</b><div style="color:#c4b5fd">${esc(c.title||'')}</div><p class="muted">${esc(c.personality||'')}</p><button class="btn" data-action="editChar" data-i="${i}">Edit</button> <button class="btn" data-action="cloneChar" data-i="${i}">Clone</button> <button class="btn danger" data-action="deleteChar" data-i="${i}">Delete</button></div>`).join('')}</div>`}
async function chats(){const rows=(await api('/chat-index')).conversations||[];$('content').innerHTML=`<div class="card"><b>Chat History</b><div class="muted">${rows.length} threads</div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>User</th><th>Character</th><th>Messages</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td>${esc(x.character_id)}</td><td>${esc(x.message_count)}</td><td><button class="btn" data-action="openChat" data-user="${esc(x.user_id)}" data-char="${esc(x.character_id)}">Open</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function premium(){const rows=(await api('/premium')).entitlements||[];$('content').innerHTML=`<div class="card"><b>Premium</b><div style="overflow:auto;margin-top:12px"><table class="table"><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td>${esc(x.plan_id)}</td><td>${esc(x.status)}</td><td>${esc(x.expiration_date||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function logs(){const [a,e,g]=await Promise.all([api('/audit'),api('/logs/energy'),api('/logs/gems')]);$('content').innerHTML=`<div class="cards2"><div class="card"><b>Energy Logs</b>${(e.logs||[]).slice(0,30).map(x=>`<p class="muted">${esc(x.user_id)} · ${esc(x.amount||'')}</p>`).join('')}</div><div class="card"><b>Gems Logs</b>${(g.logs||[]).slice(0,30).map(x=>`<p class="muted">${esc(x.user_id)} · ${esc(x.amount||'')}</p>`).join('')}</div><div class="card"><b>Audit Logs</b>${(a.auditLogs||[]).slice(0,30).map(x=>`<p class="muted">${esc(x.action||'')}</p>`).join('')}</div></div>`}
async function support(){const rows=(await api('/support')).tickets||[];$('content').innerHTML=`<div class="card"><b>Support</b>${rows.map(x=>`<p><b>${esc(x.subject||'Ticket')}</b> · ${esc(x.status||'open')}<br><span class="muted">${esc(x.message||'')}</span></p>`).join('')}</div>`}
async function config(){const c=(await api('/config')).config||{};$('content').innerHTML=`<div class="grid">${stat('Telegram',c.botUsername||'@Rubby_Chan_Bot')}${stat('AI',c.activeAiService||'Gemini')}${stat('Model',c.defaultModel||'Gemini')}${stat('Status','Online')}</div>`}
function modal(html){$('modal').innerHTML=`<div class="modal"><div class="modal-box">${html}</div></div>`}function closeModal(){$('modal').innerHTML=''}
function editUser(u){modal(`<b>Edit User</b><p class="muted">${esc(u.id)}</p><input id="ed" class="field" type="number" placeholder="Energy +/-"><input id="gd" class="field" type="number" placeholder="Gems +/-" style="margin-top:8px"><select id="st" class="field" style="margin-top:8px"><option>active</option><option>suspended</option><option>banned</option></select><div style="margin-top:12px"><button class="btn primary" id="saveUser">Save</button> <button class="btn" id="grantVip">Grant VIP</button> <button class="btn" id="closeModal">Close</button></div>`);$('saveUser').onclick=async()=>{await api('/users/'+encodeURIComponent(u.id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number($('ed').value||0),gemsDelta:Number($('gd').value||0)})});await api('/users/'+encodeURIComponent(u.id)+'/status',{method:'POST',body:JSON.stringify({status:$('st').value})});closeModal();users()};$('grantVip').onclick=async()=>{await api('/users/'+encodeURIComponent(u.id)+'/grant-vip',{method:'POST',body:JSON.stringify({action:'grant',planId:'1month',days:30})});closeModal();users()};$('closeModal').onclick=closeModal}
async function historyUser(u){modal('<b>Chat History</b><div id="historyBody" class="muted">Loading…</div>');const rows=((await api('/chat-index')).conversations||[]).filter(x=>String(x.user_id)===String(u.id));$('historyBody').innerHTML=rows.map(x=>`<p><button class="btn" data-action="openChat" data-user="${esc(x.user_id)}" data-char="${esc(x.character_id)}">${esc(x.character_id)} · ${esc(x.message_count)} messages</button></p>`).join('')||'No messages'}
async function openChat(u,c){modal('<b>Conversation</b><div id="chatBody" class="muted">Loading…</div>');const rows=(await api('/chat-logs/'+encodeURIComponent(u)+'/'+encodeURIComponent(c))).messages||[];$('chatBody').innerHTML=rows.map(m=>`<div class="card" style="margin:8px 0"><div class="muted">${esc(m.sender)} · ${esc(m.created_at||'')}</div><div style="white-space:pre-wrap;margin-top:6px">${esc(m.text||'')}</div>${m.image_url?`<img src="${esc(m.image_url)}" style="max-width:100%;margin-top:8px;border-radius:8px">`:''}</div>`).join('')||'No messages'}
function charForm(c){modal(`<b>${c?'Edit':'New'} Character</b><input id="cn" class="field" placeholder="Name" value="${esc(c?.name||'')}" style="margin-top:10px"><input id="ct" class="field" placeholder="Title" value="${esc(c?.title||'')}" style="margin-top:8px"><input id="ca" class="field" placeholder="Avatar URL" value="${esc(c?.avatar||'')}" style="margin-top:8px"><textarea id="cp" class="field" style="height:90px;margin-top:8px" placeholder="Personality">${esc(c?.personality||'')}</textarea><textarea id="cb" class="field" style="height:90px;margin-top:8px" placeholder="Background">${esc(c?.background||'')}</textarea><textarea id="cg" class="field" style="height:70px;margin-top:8px" placeholder="Greeting">${esc(c?.greeting||'')}</textarea><textarea id="cs" class="field" style="height:110px;margin-top:8px" placeholder="System Prompt">${esc(c?.system_prompt||'')}</textarea><div style="margin-top:12px"><button class="btn primary" id="saveChar">Save</button> <button class="btn" id="closeChar">Close</button></div>`);$('saveChar').onclick=async()=>{await api('/characters',{method:'POST',body:JSON.stringify({id:c?.id||undefined,name:$('cn').value,title:$('ct').value,avatar:$('ca').value,personality:$('cp').value,background:$('cb').value,greeting:$('cg').value,systemPrompt:$('cs').value,isActive:true})});closeModal();characters()};$('closeChar').onclick=closeModal}
async function cloneChar(id){await api('/characters/'+encodeURIComponent(id)+'/duplicate',{method:'POST',body:'{}'});characters()}async function deleteChar(id){if(confirm('Delete character?')){await api('/characters/'+encodeURIComponent(id),{method:'DELETE'});characters()}}
$('signIn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=logout;$('refresh').onclick=render;document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){current=p.dataset.page;render();return}const a=e.target.closest('[data-action]');if(!a)return;const i=Number(a.dataset.i);switch(a.dataset.action){case'editUser':editUser(usersCache[i]);break;case'historyUser':historyUser(usersCache[i]);break;case'newChar':charForm();break;case'editChar':charForm(charsCache[i]);break;case'cloneChar':cloneChar(charsCache[i].id);break;case'deleteChar':deleteChar(charsCache[i].id);break;case'openChat':openChat(a.dataset.user,a.dataset.char);break}});
if(adminKey)showApp();
</script>
</body>
</html>
