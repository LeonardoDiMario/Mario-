name: Hard remove owner portal

on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: hard-remove owner portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove admin portal from App.tsx
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          replacements = [
              ("import { AdminDashboardModal } from './components/AdminDashboardModal';\n", ""),
              ("  const [isAdminModalOpen, setIsAdminModalOpen] = useState<boolean>(false);\n", ""),
              ("""\n    const params = new URLSearchParams(window.location.search);\n    const path = window.location.pathname.toLowerCase();\n    if (\n      params.get('admin') === 'true' || params.get('admin') === 'rubychan' || params.get('admin') === '1' ||\n      params.get('admin') === 'owner' || params.get('owner') === '1' || params.get('owner') === 'true' ||\n      params.get('key') === 'rubychan_admin_2026' || path === '/admin' || path === '/owner' || path === '/owner-login'\n    ) {\n      localStorage.setItem('rubychan_admin_key', 'rubychan_admin_2026');\n      setIsAdminModalOpen(true);\n    }\n""", "\n"),
              (" && !policyModalType && !isAdminModalOpen}", " && !policyModalType}"),
              ("\n      <AdminDashboardModal isOpen={isAdminModalOpen} onClose={() => setIsAdminModalOpen(false)} />", ""),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected owner-portal snippet not found: {old[:120]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Verify owner portal references are gone
        run: |
          ! grep -n "AdminDashboardModal\|isAdminModalOpen\|rubychan_admin_key\|owner-login\|rubychan_admin_2026" src/App.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "chore: hard-remove owner portal" || exit 0
          git push