name: Remove Owner Portal Auto Open

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply owner portal removal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove owner portal auto-open hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.tsx')
          s = p.read_text()

          # Remove admin dashboard import/state.
          s = s.replace("import { AdminDashboardModal } from './components/AdminDashboardModal';\n", "")
          s = s.replace("  const [isAdminModalOpen, setIsAdminModalOpen] = useState<boolean>(false);\n", "")

          # Remove the URL/query based auto-open block.
          s = re.sub(
              r"\n    const params = new URLSearchParams\(window\.location\.search\);\n    const path = window\.location\.pathname\.toLowerCase\(\);\n    if \(\n      params\.get\('admin'\) === 'true' \|\| params\.get\('admin'\) === 'rubychan' \|\| params\.get\('admin'\) === '1' \|\|\n      params\.get\('admin'\) === 'owner' \|\| params\.get\('owner'\) === '1' \|\| params\.get\('owner'\) === 'true' \|\|\n      params\.get\('key'\) === 'rubychan_admin_2026' \|\| path === '/admin' \|\| path === '/owner' \|\| path === '/owner-login'\n    \) \{\n      localStorage\.setItem\('rubychan_admin_key', 'rubychan_admin_2026'\);\n      setIsAdminModalOpen\(true\);\n    \}\n", "\n", s, count=1)

          # Remove admin modal render.
          s = re.sub(r"\n\s*<AdminDashboardModal[\s\S]*?/>\n", "\n", s, count=1)

          # Remove admin modal from nav visibility condition.
          s = s.replace(" && !isAdminModalOpen", "")

          p.write_text(s)
          PY

      - name: Verify removal
        run: |
          if grep -n "AdminDashboardModal\|isAdminModalOpen\|rubychan_admin_2026\|path === '/owner'\|path === '/admin'" src/App.tsx; then
            echo 'Owner Portal hooks still present.'
            exit 1
          fi

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove-owner-portal.yml
          git add -A
          git commit -m 'chore: apply owner portal removal'
          git push
