name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install
      - name: Build main app
        run: npm run build
      - name: Include existing owner pages
        run: |
          test -f public/owner/index.html
          test -f public/owner/platform.html
          test -f owner.html
          mkdir -p dist/owner
          cp public/owner/index.html dist/owner/index.html
          cp public/owner/platform.html dist/owner/platform.html
          cp owner.html dist/owner.html
      - name: Build supplied Owner Hub template unchanged
        run: |
          rm -rf /tmp/ownerhub-src
          mkdir -p /tmp/ownerhub-src
          base64 -d ownerhub-bundle.zip | base64 -d > /tmp/ownerhub-bundle-decoded.zip
          unzip -q /tmp/ownerhub-bundle-decoded.zip -d /tmp/ownerhub-src
          cd /tmp/ownerhub-src/ownerhub_connected
          npm install
          npm run build
          test -f dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist/ownerhub"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/ownerhub/"
          test -f "$GITHUB_WORKSPACE/dist/ownerhub/index.html"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
