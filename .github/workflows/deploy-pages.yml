name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Open Characters first in Telegram Mini App
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "const [activeTab, setActiveTab] = useState<'home' | 'characters' | 'chats' | 'settings'>('home');"
          new = "const [activeTab, setActiveTab] = useState<'home' | 'characters' | 'chats' | 'settings'>('characters');"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Build
        run: npm run build

      - name: Include Owner Portals in Pages artifact
        run: |
          test -f owner.html
          test -f owner-live.html
          test -f owner-history.html
          cp owner.html dist/owner.html
          cp owner-live.html dist/owner-live.html
          cp owner-history.html dist/owner-history.html
          test -f dist/owner.html
          test -f dist/owner-live.html
          test -f dist/owner-history.html
          ls -lh dist/owner*.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
