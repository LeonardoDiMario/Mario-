name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install
      - name: Build main app
        run: npm run build
      - name: Include existing owner pages
        run: |
          test -f public/owner/index.html
          test -f public/owner/platform.html
          test -f owner.html
          mkdir -p dist/owner
          cp public/owner/index.html dist/owner/index.html
          cp public/owner/platform.html dist/owner/platform.html
          cp owner.html dist/owner.html
      - name: Build supplied Owner Hub template unchanged
        run: |
          rm -rf /tmp/ownerhub-src /tmp/ownerhub-bundle.zip
          mkdir -p /tmp/ownerhub-src
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          import zipfile

          src = Path('ownerhub-bundle.zip').read_bytes()
          candidates = [src]
          for _ in range(2):
              try:
                  nxt = base64.b64decode(candidates[-1], validate=True)
                  candidates.append(nxt)
              except Exception:
                  break

          for data in candidates:
              if data.startswith(b'PK') and zipfile.is_zipfile(io.BytesIO(data)):
                  Path('/tmp/ownerhub-bundle.zip').write_bytes(data)
                  break
          else:
              raise SystemExit('Owner Hub bundle is neither a ZIP nor a valid base64-encoded ZIP')
          PY
          unzip -q /tmp/ownerhub-bundle.zip -d /tmp/ownerhub-src
          cd /tmp/ownerhub-src/ownerhub_connected
          npm install
          npm run build
          test -f dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist/ownerhub"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/ownerhub/"
          test -f "$GITHUB_WORKSPACE/dist/ownerhub/index.html"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
