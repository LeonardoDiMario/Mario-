<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RubyChan Owner History</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b0514;color:#f1f5f9;font-family:system-ui}.card{background:#180b28d9;backdrop-filter:blur(14px);border:1px solid #e11d4833}.btn{padding:.55rem .8rem;border-radius:12px;font-size:12px;font-weight:800}.on{background:#e11d48;color:#fff}.dark{background:#160b25;border:1px solid #3f244f;color:#cbd5e1}.inp{background:#12071f;border:1px solid #3f244f;color:#fff;border-radius:12px;padding:.65rem;width:100%}.modal{position:fixed;inset:0;background:#020008dd;display:grid;place-items:center;padding:16px}.modal>div{max-width:1000px;width:100%;max-height:92vh;overflow:auto}</style></head><body class="p-4 md:p-8"><main class="max-w-7xl mx-auto space-y-5"><header class="card rounded-2xl p-6 flex flex-wrap justify-between gap-3"><div><h1 class="text-2xl font-black text-rose-300">👑 RubyChan Owner — Chat History</h1><p class="text-xs text-slate-400">Live messages directly from chat_messages</p></div><div class="flex gap-2 items-center"><span id="state" class="text-xs text-amber-300">● Locked</span><button class="btn dark" onclick="login()">Login</button><button class="btn dark" onclick="logout()">Logout</button></div></header><div class="card rounded-2xl p-4"><div class="flex flex-wrap gap-2"><input id="search" class="inp max-w-md" placeholder="Search user ID / character ID"><button class="btn on" onclick="loadIndex()">Refresh History</button></div></div><section id="list" class="space-y-3"></section></main><div id="modal"></div><script>const BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';let key=sessionStorage.getItem('ruby_owner_key')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json','x-admin-key':key};const r=await fetch(BASE+p,o),d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function login(){const p=prompt('Owner password');if(!p)return;fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})}).then(async r=>{const d=await r.json();if(!d.success)throw Error('Invalid owner password');key=d.adminKey;sessionStorage.setItem('ruby_owner_key',key);document.getElementById('state').textContent='● Online';document.getElementById('state').className='text-xs text-emerald-300';loadIndex()}).catch(e=>alert(e.message))}function logout(){sessionStorage.removeItem('ruby_owner_key');key='';location.reload()}function open(h){document.getElementById('modal').innerHTML='<div><div class="card rounded-2xl p-6">'+h+'</div></div>'}function close(){document.getElementById('modal').innerHTML=''}async function loadIndex(){const box=document.getElementById('list');box.innerHTML='<div class="card rounded-2xl p-6 text-slate-400">Loading…</div>';try{const d=await api('/chat-index');const q=(document.getElementById('search').value||'').toLowerCase();const rows=(d.conversations||[]).filter(x=>!q||String(x.user_id).toLowerCase().includes(q)||String(x.character_id).toLowerCase().includes(q));box.innerHTML=rows.length?rows.map(x=>'<button class="card rounded-2xl p-4 w-full text-left hover:border-rose-500/50" onclick="showChat(\''+encodeURIComponent(x.user_id)+'\',\''+encodeURIComponent(x.character_id)+'\',\''+esc(x.character_id)+'\')"><div class="flex justify-between gap-3"><div><b>👤 '+esc(x.user_id)+'</b><div class="text-xs text-rose-300 mt-1">🎭 '+esc(x.character_id)+'</div></div><div class="text-right text-[10px] text-slate-500"><div>'+esc(x.message_count)+' messages</div><div>'+esc(x.updated_at||'')+'</div></div></div></button>').join(''):'<div class="card rounded-2xl p-6 text-slate-500">No chat messages found.</div>'}catch(e){box.innerHTML='<div class="card rounded-2xl p-6 text-red-300">History Error: '+esc(e.message)+'</div>'}}async function showChat(uid,cid,title){try{const d=await api('/chat-logs/'+uid+'/'+cid);open('<div class="flex justify-between items-center gap-3"><div><h2 class="text-xl font-black">💬 '+title+'</h2><p class="text-xs text-slate-500">User: '+esc(decodeURIComponent(uid))+'</p></div><button class="btn dark" onclick="close()">Close</button></div><div class="space-y-3 mt-5">'+((d.messages||[]).map(m=>'<div class="rounded-2xl p-4 '+(m.sender==='user'?'bg-purple-950/40':'bg-rose-950/30')+'"><div class="text-[10px] text-slate-500">'+esc(m.sender)+' • '+esc(m.created_at||'')+'</div><div class="mt-2 whitespace-pre-wrap text-sm">'+esc(m.text||'')+'</div>'+(m.image_url?'<img src="'+esc(m.image_url)+'" class="mt-3 rounded-xl max-h-96">':'')+'</div>').join('')||'<div class="text-slate-500">No messages.</div>')+'</div>')}catch(e){open('<div class="text-red-300">Failed to load history: '+esc(e.message)+'</div>')}}if(key){document.getElementById('state').textContent='● Online';document.getElementById('state').className='text-xs text-emerald-300'}loadIndex();</script></body></html>
