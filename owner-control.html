<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RubyChan Owner Control Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b0514;color:#f1f5f9;font-family:system-ui}.card{background:#180b28e8;backdrop-filter:blur(14px);border:1px solid #e11d4833}.btn{padding:.55rem .8rem;border-radius:12px;font-size:12px;font-weight:800}.on{background:#e11d48;color:#fff}.dark{background:#160b25;border:1px solid #3f244f;color:#cbd5e1}.danger{background:#450a0a;border:1px solid #7f1d1d;color:#fecaca}.inp{background:#12071f;border:1px solid #3f244f;color:#fff;border-radius:12px;padding:.65rem;width:100%}.pill{font-size:10px;border-radius:999px;padding:.2rem .5rem}.modal{position:fixed;inset:0;background:#020008e8;display:grid;place-items:center;z-index:60;padding:16px}.modal>div{max-width:1000px;width:100%;max-height:92vh;overflow:auto}.msg{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body class="p-4 md:p-8">
<main class="max-w-7xl mx-auto space-y-5">
<header class="card rounded-2xl p-6 flex flex-wrap justify-between gap-4">
<div class="flex gap-4 items-center"><div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-purple-600 grid place-items-center text-2xl">👑</div><div><h1 class="text-2xl font-black text-rose-300">RubyChan AI Owner Portal</h1><p class="text-xs text-slate-400">Master Control Center</p></div></div>
<div class="flex gap-2 items-center"><span id="state" class="pill bg-amber-950 text-amber-300">● Locked</span><button class="btn dark" onclick="login()">Login</button><button class="btn dark" onclick="logout()">Logout</button></div>
</header>
<nav id="tabs" class="flex flex-wrap gap-2 border-b border-rose-900/30 pb-3"></nav>
<section id="app"></section>
</main>
<div id="modal"></div>
<script>
const BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';
let key=sessionStorage.getItem('ruby_owner_key')||'';
let tab='stats';
const tabs=[['stats','📊 Stats'],['users','👥 Users'],['characters','🎭 Characters'],['chats','💬 Chat History'],['premium','👑 Premium'],['broadcast','📣 Broadcast'],['logs','🧾 Logs'],['support','🎫 Support'],['config','⚙️ Config']];
const app=()=>document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json','x-admin-key':key};const r=await fetch(BASE+path,opts);const d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function open(html){document.getElementById('modal').innerHTML='<div><div class="card rounded-2xl p-6">'+html+'</div></div>'}
function close(){document.getElementById('modal').innerHTML=''}
function login(){const pass=prompt('Owner password');if(!pass)return;fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:pass})}).then(async r=>{const d=await r.json();if(!d.success)throw Error('Invalid owner password');key=d.adminKey;sessionStorage.setItem('ruby_owner_key',key);online();render()}).catch(e=>alert(e.message))}
function logout(){sessionStorage.removeItem('ruby_owner_key');location.reload()}
function online(){const s=document.getElementById('state');s.textContent='● Online';s.className='pill bg-emerald-950 text-emerald-300'}
function nav(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>`<button class="btn ${tab===id?'on':'dark'}" onclick="tab='${id}';render()">${label}</button>`).join('')}
async function render(){nav();app().innerHTML='<div class="card rounded-2xl p-10 text-center text-slate-400">Loading…</div>';try{if(tab==='stats')return stats();if(tab==='users')return users();if(tab==='characters')return characters();if(tab==='chats')return chats();if(tab==='premium')return premium();if(tab==='broadcast')return broadcast();if(tab==='logs')return logs();if(tab==='support')return support();return config()}catch(e){app().innerHTML=`<div class="card rounded-2xl p-6 text-red-300">Owner API Error: ${esc(e.message)}</div>`}}
async function stats(){const d=await api('/stats'),s=d.stats||{};app().innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-6 gap-4">${card('Users',s.totalUsers,'Members')}${card('Characters',s.activeCharacters,'Active')}${card('Conversations',s.totalConversations,'Threads')}${card('Tickets',s.openTickets,'Open')}${card('Energy',s.totalEnergy,'Global')}${card('Gems',s.totalGems,'Global')}</div>`}
function card(a,b,c){return `<div class="card rounded-2xl p-5"><div class="text-xs text-slate-400">${a}</div><div class="text-2xl font-black mt-1">${esc(b)}</div><div class="text-[10px] text-slate-500 mt-1">${c}</div></div>`}
async function users(q=''){const d=await api('/users?limit=200'+(q?'&q='+encodeURIComponent(q):''));app().innerHTML=`<div class="card rounded-2xl overflow-auto"><div class="p-4 flex flex-wrap justify-between gap-3"><b>Users (${d.total||0})</b><input id="uq" class="inp max-w-sm" placeholder="Search user" value="${esc(q)}" onkeydown="if(event.key==='Enter')users(this.value)"></div><table class="w-full text-xs"><thead><tr class="text-slate-500"><th class="p-3 text-left">User</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Status</th><th>Actions</th></tr></thead><tbody>${(d.users||[]).map(u=>`<tr class="border-t border-rose-900/20"><td class="p-3"><b>${esc(u.username||u.first_name||u.id)}</b><div class="text-[10px] text-slate-500">${esc(u.id)}</div></td><td>${esc(u.plan||'free')}</td><td>⚡${u.energy??0}</td><td>💎${u.gems??0}</td><td>${esc(u.status||'active')}</td><td class="p-2"><button class="btn dark" onclick='editUser(${JSON.stringify(u)})'>Edit</button><button class="btn dark ml-1" onclick='openUserHistory(${JSON.stringify(u)})'>History</button></td></tr>`).join('')}</tbody></table></div>`}
function editUser(u){open(`<h2 class="text-xl font-black">Edit User</h2><p class="text-xs text-slate-400 mt-1">${esc(u.username||u.id)} • ${esc(u.id)}</p><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="ued" class="inp" type="number" value="0" placeholder="Energy +/-"><input id="ugd" class="inp" type="number" value="0" placeholder="Gems +/-"></div><select id="ust" class="inp mt-3"><option value="active" ${u.status==='active'?'selected':''}>active</option><option value="suspended" ${u.status==='suspended'?'selected':''}>suspended</option><option value="banned" ${u.status==='banned'?'selected':''}>banned</option></select><div class="flex flex-wrap gap-2 mt-4"><button class="btn on" onclick="saveUser('${esc(u.id)}')">Save</button><button class="btn dark" onclick="grantVip('${esc(u.id)}')">VIP</button><button class="btn dark" onclick="openUserHistory(${JSON.stringify(u)})">Chat History</button><button class="btn dark" onclick="close()">Close</button></div>`)}
async function saveUser(id){try{await api('/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number(document.getElementById('ued').value||0),gemsDelta:Number(document.getElementById('ugd').value||0)})});await api('/users/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:document.getElementById('ust').value})});close();await users();alert('User updated')}catch(e){alert('User update failed: '+e.message)}}
async function grantVip(id){const action=prompt('grant or revoke','grant');if(!action)return;const days=Number(prompt('VIP days','30')||30);try{await api('/users/'+encodeURIComponent(id)+'/grant-vip',{method:'POST',body:JSON.stringify({action,planId:'1month',days})});alert('VIP updated');}catch(e){alert('VIP update failed: '+e.message)}}
async function openUserHistory(u){open('<div class="text-slate-400">Loading history…</div>');try{const idx=await api('/chat-index');const rows=(idx.conversations||[]).filter(x=>String(x.user_id)===String(u.id));open(`<div class="flex justify-between items-center"><div><h2 class="text-xl font-black">${esc(u.username||u.id)} — Chat History</h2><p class="text-xs text-slate-400">Only this user's threads</p></div><button class="btn dark" onclick="close()">Close</button></div><div class="space-y-2 mt-4">${rows.length?rows.map(x=>`<button class="card rounded-xl p-4 w-full text-left" onclick="viewHistory('${encodeURIComponent(x.user_id)}','${encodeURIComponent(x.character_id)}','${esc(x.character_id)}')"><b>🎭 ${esc(x.character_id)}</b><div class="text-[10px] text-slate-500">${esc(x.message_count)} messages • ${esc(x.updated_at||'')}</div></button>`).join(''):'<div class="text-slate-500">No stored chat messages for this user.</div>'}</div>`)}catch(e){open(`<div class="text-red-300">History failed: ${esc(e.message)}</div>`)} }
async function viewHistory(uid,cid,title){try{const d=await api('/chat-logs/'+uid+'/'+cid);open(`<div class="flex justify-between items-center"><div><h2 class="text-xl font-black">💬 ${title}</h2><p class="text-xs text-slate-500">User: ${esc(decodeURIComponent(uid))}</p></div><button class="btn dark" onclick="close()">Close</button></div><div class="space-y-3 mt-4">${(d.messages||[]).map(m=>`<div class="rounded-2xl p-4 ${m.sender==='user'?'bg-purple-950/40':'bg-rose-950/30'}"><div class="text-[10px] text-slate-500">${esc(m.sender)} • ${esc(m.created_at||'')}</div><div class="msg text-sm mt-2">${esc(m.text||'')}</div>${m.image_url?`<img src="${esc(m.image_url)}" class="mt-3 rounded-xl max-h-96">`:''}</div>`).join('')||'<div class="text-slate-500">No messages</div>'}</div>`)}catch(e){open(`<div class="text-red-300">Failed to load history: ${esc(e.message)}</div>`)} }
async function characters(){const d=await api('/characters');app().innerHTML=`<div class="flex justify-between items-center mb-3"><b>Characters (${(d.characters||[]).length})</b><button class="btn on" onclick="characterForm()">+ New Character</button></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${(d.characters||[]).map(c=>`<div class="card rounded-2xl p-4"><div class="flex gap-3"><img src="${esc(c.avatar||'')}" class="w-16 h-16 rounded-2xl object-cover bg-slate-900"><div><b>${esc(c.name)}</b><div class="text-[11px] text-rose-300">${esc(c.title||'')}</div><div class="text-[10px] text-slate-400 mt-1 line-clamp-3">${esc(c.personality||'')}</div></div></div><div class="flex gap-2 mt-4"><button class="btn on" onclick='characterForm(${JSON.stringify(c)})'>Edit</button><button class="btn dark" onclick='cloneCharacter(${JSON.stringify(c.id)})'>Clone</button><button class="btn danger" onclick='deleteCharacter(${JSON.stringify(c.id)})'>Delete</button></div></div>`).join('')}</div>`}
function characterForm(c={}){open(`<h2 class="text-xl font-black">${c.id?'Edit Character':'Create Character'}</h2><p class="text-xs text-slate-400 mt-1">Character controls appear only in the Characters tab.</p><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="cid" class="inp" placeholder="ID" value="${esc(c.id||'')}"><input id="cn" class="inp" placeholder="Name" value="${esc(c.name||'')}"><input id="ct" class="inp" placeholder="Title" value="${esc(c.title||'')}"><input id="ca" class="inp" placeholder="Avatar URL" value="${esc(c.avatar||'')}"><input id="cc" class="inp" placeholder="Category" value="${esc(c.category||'Anime')}"><input id="cv" class="inp" placeholder="Voice" value="${esc(c.voice_name||c.voiceName||'Kore')}"></div><textarea id="cp" class="inp mt-3" rows="4" placeholder="Personality">${esc(c.personality||'')}</textarea><textarea id="cb" class="inp mt-3" rows="4" placeholder="Background / Backstory">${esc(c.background||'')}</textarea><textarea id="cg" class="inp mt-3" rows="3" placeholder="Greeting">${esc(c.greeting||'')}</textarea><textarea id="cs" class="inp mt-3" rows="5" placeholder="System Prompt">${esc(c.system_prompt||c.systemPrompt||'')}</textarea><label class="flex gap-2 items-center mt-3 text-xs"><input id="cprem" type="checkbox" ${c.is_premium||c.isPremium?'checked':''}> Premium Character</label><div class="flex gap-2 mt-4"><button class="btn on" onclick="saveCharacter(${c.id?JSON.stringify(c.id):'null'})">Save Character</button><button class="btn dark" onclick="close()">Cancel</button></div>`)}
async function saveCharacter(existingId){const p={id:document.getElementById('cid').value||undefined,name:document.getElementById('cn').value,title:document.getElementById('ct').value,avatar:document.getElementById('ca').value,category:document.getElementById('cc').value,personality:document.getElementById('cp').value,background:document.getElementById('cb').value,greeting:document.getElementById('cg').value,systemPrompt:document.getElementById('cs').value,voiceName:document.getElementById('cv').value,isPremium:document.getElementById('cprem').checked,isActive:true};try{if(existingId){await api('/characters/'+encodeURIComponent(existingId),{method:'PUT',body:JSON.stringify(p)})}else{await api('/characters',{method:'POST',body:JSON.stringify(p)})}close();await characters();alert('Character saved')}catch(e){alert('Character save failed: '+e.message)}}
async function cloneCharacter(id){try{await api('/characters/'+encodeURIComponent(id)+'/duplicate',{method:'POST',body:'{}'});await characters()}catch(e){alert('Clone failed: '+e.message)}}
async function deleteCharacter(id){if(!confirm('Delete this character?'))return;try{await api('/characters/'+encodeURIComponent(id),{method:'DELETE'});await characters()}catch(e){alert('Delete failed: '+e.message)}}
async function chats(){const d=await api('/chat-index');const rows=d.conversations||[];app().innerHTML=`<div class="card rounded-2xl p-4"><div class="flex justify-between"><b>All Chat Threads (${rows.length})</b><button class="btn dark" onclick="chats()">Refresh</button></div><div class="space-y-2 mt-3">${rows.map(c=>`<button class="w-full text-left p-4 bg-[#12071f] rounded-xl" onclick="viewHistory('${encodeURIComponent(c.user_id)}','${encodeURIComponent(c.character_id)}','${esc(c.character_id)}')"><b>👤 ${esc(c.user_id)}</b> → <span class="text-rose-300">${esc(c.character_id)}</span><div class="text-[10px] text-slate-500">${esc(c.message_count)} messages • ${esc(c.updated_at||'')}</div></button>`).join('')||'<div class="text-slate-500">No chat messages found</div>'}</div></div>`}
async function premium(){const d=await api('/premium');app().innerHTML=`<div class="card rounded-2xl overflow-auto p-4"><b>Premium / VIP Entitlements</b><table class="w-full mt-3 text-xs"><tbody>${(d.entitlements||[]).map(e=>`<tr class="border-t border-rose-900/20"><td class="p-3">${esc(e.user_id)}</td><td>${esc(e.plan_id)}</td><td>${esc(e.status)}</td><td>${esc(e.expiration_date||e.expirationDate||'')}</td></tr>`).join('')}</tbody></table></div>`}
async function broadcast(){app().innerHTML=`<div class="card rounded-2xl p-6 max-w-2xl"><b>Telegram Broadcast</b><textarea id="bm" class="inp mt-4" rows="7" placeholder="Message to all Telegram members"></textarea><button class="btn on mt-3" onclick="sendBroadcast()">Send Broadcast</button></div>`}
async function sendBroadcast(){const msg=document.getElementById('bm').value.trim();if(!msg)return;try{const d=await api('/broadcast',{method:'POST',body:JSON.stringify({message:msg})});alert(`Sent ${d.successCount||0} / ${d.totalTargeted||0}`)}catch(e){alert('Broadcast failed: '+e.message)}}
async function logs(){const [e,g,a]=await Promise.all([api('/logs/energy'),api('/logs/gems'),api('/audit')]);app().innerHTML=`<div class="grid lg:grid-cols-3 gap-4"><div class="card rounded-2xl p-4"><b>Energy Logs</b><div class="space-y-2 mt-3">${(e.logs||[]).slice(0,50).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${esc(x.user_id)} • ${esc(x.amount)} • ${esc(x.action||'')}</div>`).join('')}</div></div><div class="card rounded-2xl p-4"><b>Gems Logs</b><div class="space-y-2 mt-3">${(g.logs||[]).slice(0,50).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${esc(x.user_id)} • ${esc(x.amount)} • ${esc(x.action||'')}</div>`).join('')}</div></div><div class="card rounded-2xl p-4"><b>Audit Logs</b><div class="space-y-2 mt-3">${(a.auditLogs||[]).slice(0,50).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${esc(x.action)} • ${esc(x.target_id||'')}</div>`).join('')}</div></div></div>`}
async function support(){const d=await api('/support');app().innerHTML=`<div class="card rounded-2xl p-4"><b>Support Tickets</b><div class="space-y-2 mt-3">${(d.tickets||[]).map(t=>`<div class="p-3 bg-[#12071f] rounded-xl flex flex-wrap justify-between gap-2"><div><b>${esc(t.subject||'Support')}</b><div class="text-xs text-slate-400">${esc(t.message||'')}</div></div><select class="inp max-w-[150px]" onchange="updateTicket('${esc(t.id)}',this.value)"><option value="open" ${t.status==='open'?'selected':''}>open</option><option value="pending" ${t.status==='pending'?'selected':''}>pending</option><option value="closed" ${t.status==='closed'?'selected':''}>closed</option></select></div>`).join('')||'<div class="text-slate-500">No tickets</div>'}</div></div>`}
async function updateTicket(id,status){try{await api('/support/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({status})})}catch(e){alert('Ticket update failed: '+e.message)}}
async function config(){const d=await api('/config');app().innerHTML=`<div class="card rounded-2xl p-6"><b>System Config</b><div class="grid md:grid-cols-2 gap-3 mt-4">${Object.entries(d.config||{}).map(([k,v])=>`<div class="p-3 bg-[#12071f] rounded-xl"><div class="text-[10px] text-slate-500">${esc(k)}</div><div class="text-sm font-bold">${esc(v)}</div></div>`).join('')}</div></div>`}
if(key)online();render();
</script>
</body>
</html>
