<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RubyChan AI - Owner Control Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
body{background:#0b0514;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.glass-card{background:rgba(24,11,40,.75);backdrop-filter:blur(12px);border:1px solid rgba(225,29,72,.2)}.modal{position:fixed;inset:0;background:rgba(2,0,8,.9);display:grid;place-items:center;padding:16px;z-index:50}.modal>div{max-width:1000px;width:100%;max-height:92vh;overflow:auto}.field{background:#140a1f;border:1px solid rgba(225,29,72,.25);color:#fff;border-radius:12px;padding:.65rem;width:100%}.btn{padding:.55rem .8rem;border-radius:12px;font-size:12px;font-weight:800}.msg{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-6xl mx-auto space-y-6">
<header class="glass-card rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4 shadow-xl border-rose-900/40">
<div class="flex items-center space-x-4"><div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-purple-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-rose-600/30">👑</div><div><h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-rose-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">RubyChan AI Owner Portal</h1><p class="text-xs text-slate-400">Master Administration & Real-Time Telemetry</p></div></div>
<div class="flex items-center gap-3"><span id="status" class="px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/50 text-emerald-400 text-xs font-bold flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Locked</span><button onclick="login()" class="px-4 py-2 bg-slate-900 text-slate-200 text-xs font-black rounded-xl">Login</button></div>
</header>
<div class="flex flex-wrap gap-2 border-b border-rose-900/30 pb-3" id="tabs"></div>
<div id="loading" class="text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl text-rose-500 mb-2"></i><p class="text-xs">Loading Owner Data...</p></div>
<div id="content"></div>
</div>
<div id="modal"></div>
<script>
const BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';
let key=sessionStorage.getItem('ruby_owner_key')||'';let current='stats';
const tabs=[['stats','fa-chart-pie','Platform Stats'],['users','fa-users','Users & Telegram Members'],['characters','fa-robot','AI Characters'],['chats','fa-comments','Chat History'],['premium','fa-crown','Premium'],['broadcast','fa-bullhorn','Broadcast Push'],['logs','fa-file-lines','Logs'],['config','fa-sliders','System Config']];
const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json','x-admin-key':key};const r=await fetch(BASE+path,opts);const d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,ic,label])=>`<button onclick="switchTab('${id}')" id="tab-${id}" class="btn ${current===id?'bg-rose-600 text-white shadow-lg shadow-rose-600/20':'bg-slate-900 text-slate-300 hover:bg-slate-800'}"><i class="fa-solid ${ic} mr-1.5"></i>${label}</button>`).join('')}
function switchTab(id){current=id;renderTabs();loadCurrent()}
async function loadCurrent(){const l=document.getElementById('loading'),c=document.getElementById('content');l.classList.remove('hidden');c.innerHTML='';try{if(current==='stats')await stats();else if(current==='users')await users();else if(current==='characters')await characters();else if(current==='chats')await chats();else if(current==='premium')await premium();else if(current==='broadcast')await broadcast();else if(current==='logs')await logs();else await config()}catch(err){c.innerHTML=`<div class="glass-card p-6 rounded-2xl text-red-300">${e(err.message)}</div>`}finally{l.classList.add('hidden')}}
function login(){const p=prompt('Owner password');if(!p)return;fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})}).then(async r=>{const d=await r.json();if(!d.success)throw Error('Invalid owner password');key=d.adminKey;sessionStorage.setItem('ruby_owner_key',key);document.getElementById('status').innerHTML='<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online & Active';loadCurrent()}).catch(x=>alert(x.message))}
function openModal(html){document.getElementById('modal').innerHTML=`<div><div class="glass-card rounded-2xl p-6">${html}</div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}
async function stats(){const d=await api('/stats'),s=d.stats||{};document.getElementById('content').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="glass-card p-5 rounded-2xl"><p class="text-xs text-slate-400 font-bold">Total Users</p><p class="text-2xl font-black">${s.totalUsers||0}</p><span class="text-[10px] text-emerald-400">Active Members</span></div><div class="glass-card p-5 rounded-2xl"><p class="text-xs text-slate-400 font-bold">VIP Members</p><p class="text-2xl font-black text-amber-400">👑 ${s.totalVipUsers||0}</p><span class="text-[10px] text-amber-400">Premium Subscribers</span></div><div class="glass-card p-5 rounded-2xl"><p class="text-xs text-slate-400 font-bold">Conversations</p><p class="text-2xl font-black text-purple-300">💬 ${s.totalConversations||0}</p><span class="text-[10px] text-purple-400">Threads</span></div><div class="glass-card p-5 rounded-2xl"><p class="text-xs text-slate-400 font-bold">Characters</p><p class="text-2xl font-black text-rose-300">🎭 ${s.activeCharacters||0}</p><span class="text-[10px] text-pink-400">Active Directory</span></div></div>`}
async function users(q=''){const d=await api('/users?limit=200'+(q?'&q='+encodeURIComponent(q):''));const rows=d.users||[];document.getElementById('content').innerHTML=`<div class="glass-card rounded-2xl overflow-hidden"><div class="p-4 bg-[#180b28] border-b border-rose-900/30 flex flex-wrap justify-between gap-3"><h3 class="font-extrabold text-sm">Registered Members & Telegram Users</h3><input id="uq" class="field max-w-sm" placeholder="Search" value="${e(q)}" onkeydown="if(event.key==='Enter')users(this.value)"></div><div class="overflow-auto"><table class="w-full text-left text-xs"><thead class="bg-[#12071f] text-slate-400 uppercase text-[10px] font-extrabold"><tr><th class="p-3">Member</th><th class="p-3">Plan</th><th class="p-3">Energy</th><th class="p-3">Gems</th><th class="p-3">Status</th><th class="p-3">Control</th></tr></thead><tbody>${rows.length?rows.map(u=>`<tr class="border-b border-rose-900/20"><td class="p-3"><b>${e(u.first_name||u.username||u.id)}</b><div class="text-[10px] text-slate-500">${e(u.telegram_id||u.id)}</div></td><td>${e(u.plan||'free')}</td><td class="text-amber-300">⚡ ${u.energy??0}</td><td class="text-rose-300">💎 ${u.gems??0}</td><td>${e(u.status||'active')}</td><td><button class="btn bg-slate-900 text-slate-200" onclick='editUser(${JSON.stringify(u)})'>Edit</button><button class="btn bg-slate-900 text-slate-200 ml-1" onclick='userHistory(${JSON.stringify(u)})'>History</button></td></tr>`).join(''):'<tr><td colspan="6" class="p-6 text-center text-slate-500">No member records found.</td></tr>'}</tbody></table></div></div>`}
function editUser(u){openModal(`<h3 class="font-extrabold text-sm">Edit User</h3><p class="text-xs text-slate-400 mt-1">${e(u.id)}</p><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="ue" class="field" type="number" value="0" placeholder="Energy +/-"><input id="ug" class="field" type="number" value="0" placeholder="Gems +/-"></div><select id="us" class="field mt-3"><option value="active" ${u.status==='active'?'selected':''}>active</option><option value="suspended" ${u.status==='suspended'?'selected':''}>suspended</option><option value="banned" ${u.status==='banned'?'selected':''}>banned</option></select><div class="flex gap-2 mt-4"><button class="btn bg-rose-600 text-white" onclick="saveUser('${e(u.id)}')">Save</button><button class="btn bg-slate-900 text-slate-200" onclick="vip('${e(u.id)}')">VIP</button><button class="btn bg-slate-900 text-slate-200" onclick='userHistory(${JSON.stringify(u)})'>History</button><button class="btn bg-slate-900 text-slate-200" onclick="closeModal()">Close</button></div>`)}
async function saveUser(id){try{await api('/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number(document.getElementById('ue').value||0),gemsDelta:Number(document.getElementById('ug').value||0)})});await api('/users/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:document.getElementById('us').value})});closeModal();await users();alert('User updated')}catch(x){alert('Update failed: '+x.message)}}
async function vip(id){const action=prompt('grant or revoke','grant');if(!action)return;const days=Number(prompt('VIP days','30')||30);try{await api('/users/'+encodeURIComponent(id)+'/grant-vip',{method:'POST',body:JSON.stringify({action,planId:'1month',days})});alert('VIP updated')}catch(x){alert(x.message)}}
async function userHistory(u){openModal('<div class="text-slate-400">Loading history…</div>');try{const d=await api('/chat-index');const rows=(d.conversations||[]).filter(x=>String(x.user_id)===String(u.id));openModal(`<div class="flex justify-between items-center"><div><h3 class="font-extrabold">${e(u.first_name||u.username||u.id)} — Chat History</h3><p class="text-[10px] text-slate-500">User: ${e(u.id)}</p></div><button class="btn bg-slate-900 text-slate-200" onclick="closeModal()">Close</button></div><div class="space-y-2 mt-4">${rows.length?rows.map(x=>`<button class="w-full text-left glass-card p-4 rounded-xl" onclick="viewHistory('${encodeURIComponent(x.user_id)}','${encodeURIComponent(x.character_id)}','${e(x.character_id)}')"><b>🎭 ${e(x.character_id)}</b><div class="text-[10px] text-slate-500">${e(x.message_count)} messages • ${e(x.updated_at||'')}</div></button>`).join(''):'<div class="text-slate-500 text-xs">No stored messages for this user.</div>'}</div>`)}catch(x){openModal('<div class="text-red-300">History error: '+e(x.message)+'</div>')}}
async function viewHistory(uid,cid,title){try{const d=await api('/chat-logs/'+uid+'/'+cid);openModal(`<div class="flex justify-between items-center"><h3 class="font-extrabold">💬 ${title}</h3><button class="btn bg-slate-900 text-slate-200" onclick="closeModal()">Close</button></div><div class="space-y-3 mt-4">${(d.messages||[]).map(m=>`<div class="rounded-xl p-4 ${m.sender==='user'?'bg-purple-950/40':'bg-rose-950/30'}"><div class="text-[10px] text-slate-500">${e(m.sender)} • ${e(m.created_at||'')}</div><div class="msg text-sm mt-2">${e(m.text||'')}</div>${m.image_url?`<img src="${e(m.image_url)}" class="mt-3 rounded-xl max-h-96">`:''}</div>`).join('')||'<div class="text-slate-500">No messages.</div>'}</div>`)}catch(x){openModal('<div class="text-red-300">Failed: '+e(x.message)+'</div>')}}
async function characters(){const d=await api('/characters'),cs=d.characters||[];document.getElementById('content').innerHTML=`<div class="flex justify-between items-center"><h3 class="font-extrabold text-sm">AI Characters Platform Directory (${cs.length})</h3><button class="btn bg-rose-600 text-white" onclick="charForm()"><i class="fa-solid fa-plus mr-1"></i> New Character</button></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">${cs.map(c=>`<div class="glass-card p-4 rounded-2xl flex items-start space-x-3.5"><img src="${e(c.avatar||'')}" class="w-14 h-14 rounded-2xl object-cover border border-rose-500/40" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'"><div class="flex-1 min-w-0"><div class="flex items-center gap-1.5"><h4 class="font-extrabold text-sm truncate">${e(c.name)}</h4>${c.is_premium?'<span class="text-[9px] bg-rose-950 text-rose-300 px-1.5 rounded">VIP</span>':''}</div><p class="text-[11px] text-rose-300">${e(c.title||'')}</p><p class="text-[10px] text-slate-400 line-clamp-2 mt-1">${e(c.personality||'')}</p><div class="flex gap-2 mt-3"><button class="btn bg-rose-600 text-white" onclick='charForm(${JSON.stringify(c)})'>Edit</button><button class="btn bg-slate-900 text-slate-200" onclick='cloneChar(${JSON.stringify(c.id)})'>Clone</button><button class="btn bg-red-950 text-red-200" onclick='deleteChar(${JSON.stringify(c.id)})'>Delete</button></div></div></div>`).join('')}</div>`}
function charForm(c={}){openModal(`<h3 class="font-extrabold text-sm">${c.id?'Edit Character':'Create Character'}</h3><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="cid" class="field" placeholder="ID" value="${e(c.id||'')}"><input id="cn" class="field" placeholder="Name" value="${e(c.name||'')}"><input id="ct" class="field" placeholder="Title" value="${e(c.title||'')}"><input id="ca" class="field" placeholder="Avatar URL" value="${e(c.avatar||'')}"><input id="cc" class="field" placeholder="Category" value="${e(c.category||'Anime')}"><input id="cv" class="field" placeholder="Voice" value="${e(c.voice_name||'Kore')}"></div><textarea id="cp" class="field mt-3" rows="4" placeholder="Personality">${e(c.personality||'')}</textarea><textarea id="cb" class="field mt-3" rows="4" placeholder="Background">${e(c.background||'')}</textarea><textarea id="cg" class="field mt-3" rows="3" placeholder="Greeting">${e(c.greeting||'')}</textarea><textarea id="cs" class="field mt-3" rows="5" placeholder="System Prompt">${e(c.system_prompt||'')}</textarea><label class="flex gap-2 items-center text-xs mt-3"><input id="cprem" type="checkbox" ${c.is_premium?'checked':''}> Premium Character</label><div class="flex gap-2 mt-4"><button class="btn bg-rose-600 text-white" onclick="saveChar('${e(c.id||'')}')">Save</button><button class="btn bg-slate-900 text-slate-200" onclick="closeModal()">Cancel</button></div>`)}
async function saveChar(existing){const p={id:document.getElementById('cid').value||undefined,name:document.getElementById('cn').value,title:document.getElementById('ct').value,avatar:document.getElementById('ca').value,category:document.getElementById('cc').value,personality:document.getElementById('cp').value,background:document.getElementById('cb').value,greeting:document.getElementById('cg').value,systemPrompt:document.getElementById('cs').value,voiceName:document.getElementById('cv').value,isPremium:document.getElementById('cprem').checked,isActive:true};try{await api('/characters',{method:'POST',body:JSON.stringify(p)});closeModal();await characters();alert('Character saved')}catch(x){alert('Save failed: '+x.message)}}
async function cloneChar(id){try{await api('/characters/'+encodeURIComponent(id)+'/duplicate',{method:'POST',body:'{}'});await characters()}catch(x){alert(x.message)}}async function deleteChar(id){if(!confirm('Delete this character?'))return;try{await api('/characters/'+encodeURIComponent(id),{method:'DELETE'});await characters()}catch(x){alert(x.message)}}
async function chats(){const d=await api('/chat-index');const rows=d.conversations||[];document.getElementById('content').innerHTML=`<div class="glass-card rounded-2xl overflow-hidden"><div class="p-4 flex justify-between"><h3 class="font-extrabold text-sm">All Chat Threads</h3><button class="btn bg-slate-900 text-slate-200" onclick="chats()">Refresh</button></div><div class="p-4 space-y-2">${rows.map(x=>`<button class="w-full text-left bg-[#12071f] rounded-xl p-4" onclick="viewHistory('${encodeURIComponent(x.user_id)}','${encodeURIComponent(x.character_id)}','${e(x.character_id)}')"><b>${e(x.user_id)}</b> → ${e(x.character_id)}</b><div class="text-[10px] text-slate-500">${e(x.message_count)} messages</div></button>`).join('')||'<div class="text-slate-500">No chat threads.</div>'}</div></div>`}
async function premium(){const d=await api('/premium');document.getElementById('content').innerHTML=`<div class="glass-card p-6 rounded-2xl"><h3 class="font-extrabold text-sm">Premium / VIP Entitlements</h3><div class="overflow-auto mt-4"><table class="w-full text-xs"><thead><tr class="text-slate-500"><th class="p-3 text-left">User</th><th>Plan</th><th>Status</th><th>Expiration</th></tr></thead><tbody>${(d.entitlements||[]).map(x=>`<tr class="border-t border-rose-900/20"><td class="p-3">${e(x.user_id)}</td><td>${e(x.plan_id)}</td><td>${e(x.status)}</td><td>${e(x.expiration_date||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="p-5 text-center text-slate-500">No entitlements</td></tr>'}</tbody></table></div></div>`}
async function broadcast(){document.getElementById('content').innerHTML=`<div class="glass-card p-6 rounded-2xl max-w-2xl"><h3 class="font-extrabold text-sm"><i class="fa-solid fa-bullhorn text-rose-400 mr-2"></i> Broadcast Push</h3><p class="text-xs text-slate-400 mt-2">The dashboard template is ready; the current Owner Edge Function does not expose a broadcast route yet, so this button is intentionally not pretending to send.</p><div class="mt-4 p-4 rounded-xl bg-[#12071f] text-xs text-amber-300">Backend route needed: <code>/broadcast</code></div></div>`}
async function logs(){const [a,e1,g]=await Promise.all([api('/audit'),api('/logs/energy'),api('/logs/gems')]);document.getElementById('content').innerHTML=`<div class="grid lg:grid-cols-3 gap-4"><div class="glass-card p-5 rounded-2xl"><b>Audit</b><div class="space-y-2 mt-3">${(a.auditLogs||[]).slice(0,40).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${e(x.action)} • ${e(x.target_id||'')}</div>`).join('')}</div></div><div class="glass-card p-5 rounded-2xl"><b>Energy</b><div class="space-y-2 mt-3">${(e1.logs||[]).slice(0,40).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${e(x.user_id)} • ${e(x.amount)}</div>`).join('')}</div></div><div class="glass-card p-5 rounded-2xl"><b>Gems</b><div class="space-y-2 mt-3">${(g.logs||[]).slice(0,40).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${e(x.user_id)} • ${e(x.amount)}</div>`).join('')}</div></div></div>`}
async function config(){const d=await api('/config');const c=d.config||{};document.getElementById('content').innerHTML=`<div class="glass-card p-6 rounded-2xl border-rose-900/40 max-w-2xl space-y-4"><h3 class="font-extrabold text-sm"><i class="fa-solid fa-sliders text-rose-400 mr-2"></i>AI & Telegram Configuration</h3><div class="grid grid-cols-2 gap-4 text-xs"><div class="p-3 bg-[#12071f] rounded-xl"><p class="text-slate-400">Telegram Bot</p><p class="text-rose-300 font-mono font-bold mt-1">${e(c.botUsername||'@Rubby_Chan_Bot')}</p></div><div class="p-3 bg-[#12071f] rounded-xl"><p class="text-slate-400">Default AI Engine</p><p class="text-emerald-400 font-mono font-bold mt-1">${e(c.defaultModel||'Gemini')}</p></div><div class="p-3 bg-[#12071f] rounded-xl"><p class="text-slate-400">Daily Free Energy</p><p class="font-bold mt-1">${e(c.dailyFreeEnergy??25)}</p></div><div class="p-3 bg-[#12071f] rounded-xl"><p class="text-slate-400">Max Free Energy</p><p class="font-bold mt-1">${e(c.maxFreeEnergy??50)}</p></div></div></div>`}
renderTabs();loadCurrent();
</script>
</body></html>
