<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RubyChan AI - Owner Control Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
body{background:#0b0514;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.glass-card{background:rgba(24,11,40,.78);backdrop-filter:blur(14px);border:1px solid rgba(225,29,72,.22)}.tab-active{background:#e11d48!important;color:white!important;box-shadow:0 10px 24px rgba(225,29,72,.2)}.muted{color:#94a3b8}.input{background:#12071f;border:1px solid rgba(225,29,72,.25);border-radius:12px;padding:.6rem .75rem;color:#fff;width:100%;outline:none}.input:focus{border-color:#f43f5e}.btn{border-radius:12px;padding:.55rem .8rem;font-size:12px;font-weight:800}.btn-primary{background:linear-gradient(90deg,#e11d48,#db2777);color:white}.btn-dark{background:#160b25;border:1px solid #3f244f;color:#cbd5e1}.btn-danger{background:#450a0a;border:1px solid #7f1d1d;color:#fecaca}.pill{padding:.2rem .5rem;border-radius:999px;font-size:10px;font-weight:800}.grid-scroll{overflow:auto}.table th,.table td{padding:.7rem;border-bottom:1px solid rgba(225,29,72,.12);text-align:left;white-space:nowrap}.table th{font-size:10px;text-transform:uppercase;color:#94a3b8}.table td{font-size:11px}.modal{position:fixed;inset:0;background:rgba(2,0,8,.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal-card{max-width:760px;width:100%;max-height:90vh;overflow:auto}
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto space-y-5">
<header class="glass-card rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4 shadow-xl">
  <div class="flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-purple-600 flex items-center justify-center text-2xl shadow-lg">👑</div><div><h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-rose-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">RubyChan AI Owner Portal</h1><p class="text-xs text-slate-400">Master Administration & Real-Time Telemetry</p></div></div>
  <div class="flex items-center gap-2 flex-wrap"><span id="online" class="pill bg-emerald-950 text-emerald-300 border border-emerald-500/40">● Checking...</span><button class="btn btn-dark" onclick="logout()"><i class="fa-solid fa-right-from-bracket mr-1"></i>Logout</button><a href="./" class="btn btn-primary"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Open MiniApp</a></div>
</header>
<nav class="flex flex-wrap gap-2 border-b border-rose-900/30 pb-3" id="tabs"></nav>
<section id="view" class="space-y-4"></section>
</div>
<div id="modalRoot"></div>
<script>
const API_BASE='https://ais-dev-avlykr7pkicyzjc426vs3q-487032049822.asia-southeast1.run.app';
const TABS=[['stats','chart-pie','Platform Stats'],['users','users','Users & Members'],['characters','robot','AI Characters'],['chats','comments','Conversations'],['premium','crown','Premium'],['broadcast','bullhorn','Broadcast Push'],['logs','list','Logs'],['support','life-ring','Support'],['config','sliders','System Config']];
let adminKey=sessionStorage.getItem('rubychan_admin_key')||''; let current='stats';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function api(path,opts={}){opts.headers={...(opts.headers||{}), 'Content-Type':'application/json','x-admin-key':adminKey};return fetch(API_BASE+path,opts).then(async r=>{const d=await r.json().catch(()=>({error:'Invalid JSON'}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;});}
function notify(msg){alert(msg)}
async function ensureAuth(){if(adminKey){try{await api('/api/admin/check');return true}catch{sessionStorage.removeItem('rubychan_admin_key');adminKey=''}}let p=prompt('Owner passcode');if(!p)return false;const d=await fetch(API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})}).then(async r=>{const x=await r.json();if(!r.ok)throw new Error(x.error||'Login failed');return x});adminKey=d.adminKey;sessionStorage.setItem('rubychan_admin_key',adminKey);return true}
function logout(){sessionStorage.removeItem('rubychan_admin_key');adminKey='';location.reload()}
function tabNav(){document.getElementById('tabs').innerHTML=TABS.map(([id,icon,label])=>`<button class="tab btn btn-dark ${current===id?'tab-active':''}" data-tab="${id}"><i class="fa-solid fa-${icon} mr-1"></i>${label}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()})}
const card=(title,val,sub,color='text-white',icon='')=>`<div class="glass-card p-5 rounded-2xl"><p class="text-xs text-slate-400 font-bold mb-1">${title}</p><p class="text-2xl font-black ${color}">${icon} ${esc(val)}</p><span class="text-[10px] text-slate-500 font-bold">${sub}</span></div>`;
async function render(){tabNav();const v=document.getElementById('view');v.innerHTML='<div class="glass-card p-10 rounded-2xl text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl text-rose-400"></i><p class="text-xs mt-2">Loading Owner Data...</p></div>';try{if(current==='stats')return stats();if(current==='users')return users();if(current==='characters')return characters();if(current==='chats')return chats();if(current==='premium')return premium();if(current==='broadcast')return broadcast();if(current==='logs')return logs();if(current==='support')return support();if(current==='config')return config()}catch(e){v.innerHTML=`<div class="glass-card p-6 rounded-2xl border border-red-900/40"><b class="text-red-300">Owner API Error</b><p class="text-xs text-slate-400 mt-2">${esc(e.message)}</p></div>`}}
async function stats(){const d=await api('/api/admin/stats');const s=d.stats||{};document.getElementById('online').innerHTML='● Online & Active';document.getElementById('online').className='pill bg-emerald-950 text-emerald-300 border border-emerald-500/40';document.getElementById('view').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-5 gap-4">${card('Total Users',s.totalUsers||0,'Registered Members','text-white','👥')}${card('Characters',s.activeCharacters||0,'Active Directory','text-rose-300','🎭')}${card('Conversations',s.totalConversations||0,'Active Chat Threads','text-purple-300','💬')}${card('Open Tickets',s.openTickets||0,'Support Queue','text-amber-300','🎫')}${card('Tracked Energy',s.totalEnergy||0,'Owner Scope','text-emerald-300','⚡')}</div><div class="grid md:grid-cols-3 gap-4"><div class="glass-card p-5 rounded-2xl"><p class="text-[10px] text-slate-500 uppercase">AI Service</p><p class="text-sm font-bold text-emerald-400 mt-1">Gemini</p></div><div class="glass-card p-5 rounded-2xl"><p class="text-[10px] text-slate-500 uppercase">Telegram Bot</p><p class="text-sm font-bold text-rose-300 mt-1">@Rubby_Chan_Bot</p></div><div class="glass-card p-5 rounded-2xl"><p class="text-[10px] text-slate-500 uppercase">Image Engine</p><p class="text-sm font-bold text-purple-300 mt-1">Gemini Image</p></div></div>`}
async function users(){const d=await api('/api/admin/users?limit=100');const rows=d.users||[];document.getElementById('view').innerHTML=`<div class="glass-card rounded-2xl overflow-hidden"><div class="p-4 flex flex-wrap gap-2 justify-between items-center bg-[#180b28]"><div><h3 class="font-extrabold text-sm">Registered Members & Telegram Users</h3><p class="text-[10px] text-slate-500">${d.total||rows.length} users</p></div><div class="flex gap-2"><input id="userQ" class="input max-w-xs" placeholder="Search username / Telegram ID" onkeydown="if(event.key==='Enter')searchUsers()"><button class="btn btn-dark" onclick="searchUsers()"><i class="fa-solid fa-search mr-1"></i>Search</button><button class="btn btn-primary" onclick="users()">Refresh</button></div></div><div class="grid-scroll"><table class="table w-full"><thead><tr><th>Member</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Status</th><th>Controls</th></tr></thead><tbody>${rows.map(u=>`<tr><td><b>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'User')}</b><div class="text-[10px] text-slate-500">${esc(u.username||'')} ${u.telegram_id?'• TG '+esc(u.telegram_id):''}</div></td><td><span class="pill ${u.plan&&u.plan!=='free'?'bg-amber-950 text-amber-300 border border-amber-500/30':'bg-slate-900 text-slate-400 border border-slate-700'}">${esc((u.plan||'free').toUpperCase())}</span></td><td class="text-amber-300 font-bold">⚡ ${esc(u.energy??50)}</td><td class="text-rose-300 font-bold">💎 ${esc(u.gems??0)}</td><td><span class="pill ${u.status==='banned'?'bg-red-950 text-red-300':'bg-emerald-950 text-emerald-300'}">${esc(u.status||'active')}</span></td><td><div class="flex gap-1 flex-wrap"><button class="btn btn-dark" onclick='balance(${JSON.stringify(u)})'>Balance</button><button class="btn btn-dark" onclick='vip(${JSON.stringify(u)})'>VIP</button><button class="btn btn-dark" onclick='statusEdit(${JSON.stringify(u)})'>Status</button><button class="btn btn-dark" onclick='userChats(${JSON.stringify(u)})'>Chats</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
async function searchUsers(){const q=document.getElementById('userQ')?.value||'';const d=await api('/api/admin/users?limit=100&q='+encodeURIComponent(q));const rows=d.users||[];document.getElementById('view').innerHTML='';current='users';tabNav();await usersRender(rows,d.total||rows.length)}
async function usersRender(rows,total){document.getElementById('view').innerHTML=`<div class="glass-card rounded-2xl overflow-hidden"><div class="p-4 flex justify-between"><b>${total} users found</b><button class="btn btn-dark" onclick="users()">Back</button></div><div class="grid-scroll"><table class="table w-full"><thead><tr><th>Member</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Status</th><th>Controls</th></tr></thead><tbody>${rows.map(u=>`<tr><td><b>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'User')}</b><div class="text-[10px] text-slate-500">${esc(u.username||'')} ${u.telegram_id?'• TG '+esc(u.telegram_id):''}</div></td><td>${esc(u.plan||'free')}</td><td>⚡ ${esc(u.energy??50)}</td><td>💎 ${esc(u.gems??0)}</td><td>${esc(u.status||'active')}</td><td><button class="btn btn-dark" onclick='balance(${JSON.stringify(u)})'>Balance</button> <button class="btn btn-dark" onclick='vip(${JSON.stringify(u)})'>VIP</button> <button class="btn btn-dark" onclick='statusEdit(${JSON.stringify(u)})'>Status</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function balance(u){openModal(`<h3 class="font-black text-lg">Balance Control</h3><p class="text-xs text-slate-400 mb-4">${esc(u.username||u.id)}</p><div class="grid grid-cols-2 gap-3"><input id="eDelta" class="input" type="number" value="0" placeholder="Energy +/-"><input id="gDelta" class="input" type="number" value="0" placeholder="Gems +/-"></div><input id="reason" class="input mt-3" placeholder="Reason"><button class="btn btn-primary mt-3" onclick="applyBalance('${esc(u.id)}')">Apply</button>`)}
async function applyBalance(id){await api('/api/admin/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number(document.getElementById('eDelta').value||0),gemsDelta:Number(document.getElementById('gDelta').value||0),reason:document.getElementById('reason').value||'Owner adjustment'})});closeModal();notify('Balance updated');users()}
async function vip(u){openModal(`<h3 class="font-black text-lg">VIP Control</h3><select id="plan" class="input mt-3"><option value="1month">1 Month VIP</option><option value="3months">3 Months VIP</option><option value="1year">1 Year VIP</option></select><input id="days" class="input mt-3" type="number" value="30" placeholder="Days"><div class="flex gap-2 mt-3"><button class="btn btn-primary" onclick="applyVip('${esc(u.id)}','grant')">Grant VIP</button><button class="btn btn-danger" onclick="applyVip('${esc(u.id)}','revoke')">Revoke</button></div>`)}
async function applyVip(id,action){await api('/api/admin/users/'+encodeURIComponent(id)+'/grant-vip',{method:'POST',body:JSON.stringify({planId:document.getElementById('plan').value,days:Number(document.getElementById('days').value||30),action})});closeModal();notify('VIP updated');users()}
async function statusEdit(u){openModal(`<h3 class="font-black text-lg">User Status</h3><select id="status" class="input mt-3"><option ${u.status==='active'?'selected':''}>active</option><option ${u.status==='suspended'?'selected':''}>suspended</option><option ${u.status==='banned'?'selected':''}>banned</option></select><button class="btn btn-primary mt-3" onclick="applyStatus('${esc(u.id)}')">Save Status</button>`)}
async function applyStatus(id){await api('/api/admin/users/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:document.getElementById('status').value})});closeModal();notify('Status updated');users()}
async function userChats(u){const d=await api('/api/admin/user-chats/'+encodeURIComponent(u.id));openModal(`<h3 class="font-black text-lg">${esc(u.username||u.id)} Chats</h3><div class="space-y-2 mt-4">${(d.chats||[]).map(c=>`<div class="glass-card p-3 rounded-xl"><b>${esc(c.character?.name||c.characterId)}</b><p class="text-[10px] text-slate-400">${c.messageCount||0} messages</p></div>`).join('')||'<p class="text-xs text-slate-500">No chats.</p>'}</div>`)}
async function characters(){const d=await api('/api/admin/characters');const cs=d.characters||[];document.getElementById('view').innerHTML=`<div class="flex flex-wrap justify-between gap-2 items-center"><div><h3 class="font-extrabold text-sm">AI Characters Platform Directory</h3><p class="text-[10px] text-slate-500">${cs.length} characters • changes affect the bot</p></div><button class="btn btn-primary" onclick="editChar()"><i class="fa-solid fa-plus mr-1"></i>Create Character</button></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cs.map(c=>`<div class="glass-card p-4 rounded-2xl flex items-start gap-3"><img src="${esc(c.avatar||'')}" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'" class="w-14 h-14 rounded-2xl object-cover border border-rose-500/40"><div class="min-w-0 flex-1"><div class="flex gap-2 items-center"><h4 class="font-extrabold text-sm truncate">${esc(c.name)}</h4>${c.isPremium?'<span class="pill bg-amber-950 text-amber-300">VIP</span>':''}</div><p class="text-[11px] text-rose-300">${esc(c.title)}</p><p class="text-[10px] text-slate-400 line-clamp-2 mt-1">${esc(c.personality)}</p><div class="flex gap-1 mt-2"><button class="btn btn-dark" onclick='editChar(${JSON.stringify(c)})'>Edit</button><button class="btn btn-dark" onclick="duplicateChar('${esc(c.id)}')">Clone</button><button class="btn btn-danger" onclick="deleteChar('${esc(c.id)}')">Delete</button></div></div></div>`).join('')}</div>`}
async function editChar(c){c=c||{};openModal(`<h3 class="font-black text-lg">${c.id?'Edit':'Create'} Character</h3><div class="grid md:grid-cols-2 gap-3 mt-3"><input id="cname" class="input" placeholder="Name" value="${esc(c.name||'')}"><input id="ctitle" class="input" placeholder="Title" value="${esc(c.title||'')}"><input id="cavatar" class="input md:col-span-2" placeholder="Avatar URL" value="${esc(c.avatar||'')}"><input id="ccat" class="input" placeholder="Category" value="${esc(c.category||'Anime')}"><input id="corder" class="input" type="number" placeholder="Sort order" value="${esc(c.sortOrder??0)}"><textarea id="cperson" class="input md:col-span-2" rows="3" placeholder="Personality">${esc(c.personality||'')}</textarea><textarea id="cback" class="input md:col-span-2" rows="3" placeholder="Background / Backstory">${esc(c.background||c.backstory||'')}</textarea><textarea id="cgreet" class="input md:col-span-2" rows="2" placeholder="Greeting">${esc(c.greeting||'Hello!')}</textarea><textarea id="csys" class="input md:col-span-2" rows="5" placeholder="System Prompt">${esc(c.systemPrompt||'')}</textarea></div><label class="flex items-center gap-2 text-xs mt-3"><input id="cprem" type="checkbox" ${c.isPremium?'checked':''}> Premium Character</label><button class="btn btn-primary mt-4" onclick="saveChar('${esc(c.id||'')}')">Save Character</button>`)}
async function saveChar(id){const payload={id:id||undefined,name:document.getElementById('cname').value,title:document.getElementById('ctitle').value,avatar:document.getElementById('cavatar').value,category:document.getElementById('ccat').value,personality:document.getElementById('cperson').value,background:document.getElementById('cback').value,greeting:document.getElementById('cgreet').value,systemPrompt:document.getElementById('csys').value,isPremium:document.getElementById('cprem').checked,sortOrder:Number(document.getElementById('corder').value||0)};await api('/api/admin/characters',{method:'POST',body:JSON.stringify(payload)});closeModal();notify('Character saved');characters()}
async function duplicateChar(id){if(!confirm('Clone this character?'))return;await api('/api/admin/characters/'+encodeURIComponent(id)+'/duplicate',{method:'POST'});notify('Character cloned');characters()}
async function deleteChar(id){if(!confirm('Delete this character from the bot?'))return;await api('/api/admin/characters/'+encodeURIComponent(id),{method:'DELETE'});notify('Character deleted');characters()}
async function chats(){const d=await api('/api/admin/conversations');const rows=d.conversations||[];document.getElementById('view').innerHTML=`<div class="glass-card rounded-2xl overflow-hidden"><div class="p-4 bg-[#180b28]"><h3 class="font-extrabold text-sm">Live Conversation Registry</h3><p class="text-[10px] text-slate-500">Recent conversations across Telegram / Web</p></div><div class="grid-scroll"><table class="table w-full"><thead><tr><th>User</th><th>Character</th><th>Messages</th><th>Last Message</th><th>Updated</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.username||c.user_id)}</td><td>${esc(c.character_name)}</td><td>${esc(c.message_count)}</td><td class="max-w-sm truncate">${esc(c.last_message||'')}</td><td>${esc(c.updated_at||'')}</td><td><button class="btn btn-dark" onclick="chatLog('${esc(c.user_id)}','${esc(c.character_id)}')">View</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function chatLog(uid,cid){const d=await api('/api/admin/chat-logs/'+encodeURIComponent(uid)+'/'+encodeURIComponent(cid));openModal(`<h3 class="font-black text-lg">${esc(d.character?.name||cid)} Chat Log</h3><div class="space-y-2 mt-4">${(d.messages||[]).map(m=>`<div class="glass-card p-3 rounded-xl"><span class="text-[10px] text-rose-300">${esc(m.sender)}</span><p class="text-xs mt-1 whitespace-pre-wrap">${esc(m.text||'')}</p></div>`).join('')}</div>`)}
async function premium(){const d=await api('/api/admin/premium');document.getElementById('view').innerHTML=`<div class="grid-scroll glass-card rounded-2xl"><div class="p-4"><h3 class="font-extrabold text-sm">Premium Entitlements</h3></div><table class="table w-full"><thead><tr><th>User</th><th>Plan</th><th>Status</th><th>Start</th><th>Expiry</th></tr></thead><tbody>${(d.entitlements||[]).map(e=>`<tr><td>${esc(e.user_id)}</td><td>${esc(e.plan_id)}</td><td>${esc(e.status)}</td><td>${esc(e.start_date)}</td><td>${esc(e.expiration_date)}</td></tr>`).join('')}</tbody></table></div>`}
async function broadcast(){document.getElementById('view').innerHTML=`<div class="glass-card p-6 rounded-2xl space-y-4 max-w-2xl"><h3 class="font-extrabold text-sm"><i class="fa-solid fa-bullhorn text-rose-400 mr-2"></i>Send Telegram Push Broadcast</h3><input id="btTitle" class="input" placeholder="Title"><textarea id="btMsg" class="input" rows="5" placeholder="Message content"></textarea><div class="grid md:grid-cols-2 gap-3"><input id="btBtn" class="input" placeholder="Button text"><input id="btUrl" class="input" placeholder="Button URL"></div><button class="btn btn-primary" onclick="sendBroadcast()"><i class="fa-solid fa-paper-plane mr-1"></i>Send Broadcast</button></div>`}
async function sendBroadcast(){const r=await api('/api/admin/broadcast',{method:'POST',body:JSON.stringify({title:document.getElementById('btTitle').value,message:document.getElementById('btMsg').value,buttonText:document.getElementById('btBtn').value,buttonUrl:document.getElementById('btUrl').value})});notify(r.message||'Broadcast sent');}
async function logs(){const [e,g,a]=await Promise.all([api('/api/admin/energy-logs'),api('/api/admin/gems-logs'),api('/api/admin/audit-logs')]);document.getElementById('view').innerHTML=`<div class="grid md:grid-cols-3 gap-4"><div class="glass-card rounded-2xl p-4"><h3 class="font-bold text-sm mb-3">⚡ Energy Logs</h3>${(e.logs||[]).slice(0,30).map(x=>`<div class="text-[10px] border-b border-rose-900/20 py-2"><b>${esc(x.user_id)}</b> ${esc(x.amount)}<br><span class="text-slate-500">${esc(x.description||x.action||'')}</span></div>`).join('')}</div><div class="glass-card rounded-2xl p-4"><h3 class="font-bold text-sm mb-3">💎 Gems Logs</h3>${(g.logs||[]).slice(0,30).map(x=>`<div class="text-[10px] border-b border-rose-900/20 py-2"><b>${esc(x.user_id)}</b> ${esc(x.amount)}<br><span class="text-slate-500">${esc(x.description||x.action||'')}</span></div>`).join('')}</div><div class="glass-card rounded-2xl p-4"><h3 class="font-bold text-sm mb-3">🧾 Audit Logs</h3>${(a.auditLogs||[]).slice(0,30).map(x=>`<div class="text-[10px] border-b border-rose-900/20 py-2"><b>${esc(x.action)}</b> → ${esc(x.target_type)}<br><span class="text-slate-500">${esc(x.created_at||'')}</span></div>`).join('')}</div></div>`}
async function support(){const d=await api('/api/admin/support');document.getElementById('view').innerHTML=`<div class="glass-card rounded-2xl overflow-hidden"><div class="p-4"><h3 class="font-extrabold text-sm">Support Tickets</h3></div><div class="grid-scroll"><table class="table w-full"><thead><tr><th>Ticket</th><th>User</th><th>Subject</th><th>Status</th><th>Action</th></tr></thead><tbody>${(d.tickets||[]).map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.user_id)}</td><td>${esc(t.subject)}</td><td>${esc(t.status)}</td><td><button class="btn btn-dark" onclick="ticket('${esc(t.id)}','${esc(t.status)}')">Update</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function ticket(id,status){openModal(`<h3 class="font-black text-lg">Support Ticket</h3><select id="tStatus" class="input mt-3"><option ${status==='open'?'selected':''}>open</option><option ${status==='pending'?'selected':''}>pending</option><option ${status==='resolved'?'selected':''}>resolved</option><option ${status==='closed'?'selected':''}>closed</option></select><textarea id="tNote" class="input mt-3" rows="4" placeholder="Admin notes"></textarea><button class="btn btn-primary mt-3" onclick="applyTicket('${esc(id)}')">Save</button>`)}
async function applyTicket(id){await api('/api/admin/support/'+encodeURIComponent(id)+'/update',{method:'POST',body:JSON.stringify({status:document.getElementById('tStatus').value,adminNotes:document.getElementById('tNote').value})});closeModal();support()}
async function config(){const d=await api('/api/admin/system-config');const c=d.config||{};document.getElementById('view').innerHTML=`<div class="glass-card p-6 rounded-2xl space-y-4 max-w-3xl"><h3 class="font-extrabold text-sm"><i class="fa-solid fa-sliders text-rose-400 mr-2"></i>System Configuration</h3><div class="grid md:grid-cols-2 gap-3"><label class="text-xs">Bot Username<input id="cfgBot" class="input mt-1" value="${esc(c.botUsername||'')}"></label><label class="text-xs">Default Model<input id="cfgModel" class="input mt-1" value="${esc(c.defaultModel||'')}"></label><label class="text-xs">Temperature<input id="cfgTemp" class="input mt-1" type="number" step="0.05" value="${esc(c.defaultTemperature??0.85)}"></label><label class="text-xs">Daily Free Energy<input id="cfgDaily" class="input mt-1" type="number" value="${esc(c.dailyFreeEnergy??25)}"></label><label class="text-xs">Max Free Energy<input id="cfgMax" class="input mt-1" type="number" value="${esc(c.maxFreeEnergy??50)}"></label></div><div class="flex flex-wrap gap-2"><button class="btn btn-primary" onclick="saveConfig()">Save Config</button><button class="btn btn-dark" onclick="backup()">Download Backup</button><button class="btn btn-danger" onclick="resetUsers()">Clear User Registry</button></div><div class="text-[10px] text-slate-500">Server uptime: ${esc(c.serverUptimeSeconds||0)}s • Node ${esc(c.nodeVersion||'')}</div></div>`}
async function saveConfig(){await api('/api/admin/system-config',{method:'POST',body:JSON.stringify({botUsername:document.getElementById('cfgBot').value,defaultModel:document.getElementById('cfgModel').value,defaultTemperature:Number(document.getElementById('cfgTemp').value),dailyFreeEnergy:Number(document.getElementById('cfgDaily').value),maxFreeEnergy:Number(document.getElementById('cfgMax').value)})});notify('Config saved');config()}
function backup(){window.open(API_BASE+'/api/admin/export-data?adminKey='+encodeURIComponent(adminKey),'_blank')}
async function resetUsers(){if(!confirm('Clear ALL user registry and chat logs?'))return;await api('/api/admin/users/reset',{method:'POST',body:JSON.stringify({action:'clear_all'})});notify('User registry cleared');stats()}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card glass-card rounded-2xl p-6">${html}<button class="btn btn-dark mt-4" onclick="closeModal()">Close</button></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
(async()=>{try{if(await ensureAuth())await render();else document.getElementById('view').innerHTML='<div class="glass-card p-10 rounded-2xl text-center text-red-300">Owner access cancelled.</div>'}catch(e){document.getElementById('view').innerHTML=`<div class="glass-card p-10 rounded-2xl text-center text-red-300">${esc(e.message)}</div>`}})();
</script>
</body>
</html>
