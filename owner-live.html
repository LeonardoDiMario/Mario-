<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RubyChan AI Owner Control Center</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b0514;color:#f1f5f9;font-family:system-ui}.card{background:#180b28d9;backdrop-filter:blur(14px);border:1px solid #e11d4833}.btn{padding:.55rem .8rem;border-radius:12px;font-size:12px;font-weight:800}.on{background:#e11d48;color:#fff}.dark{background:#160b25;border:1px solid #3f244f;color:#cbd5e1}.danger{background:#450a0a;border:1px solid #7f1d1d;color:#fecaca}.inp{background:#12071f;border:1px solid #3f244f;color:#fff;border-radius:12px;padding:.65rem;width:100%}.pill{font-size:10px;border-radius:999px;padding:.2rem .5rem}.modal{position:fixed;inset:0;background:#020008cc;display:grid;place-items:center;z-index:50;padding:16px}.modal>div{max-width:900px;width:100%;max-height:90vh;overflow:auto}</style></head><body class="p-4 md:p-8"><main class="max-w-7xl mx-auto space-y-5"><header class="card rounded-2xl p-6 flex flex-wrap justify-between gap-4"><div class="flex gap-4 items-center"><div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-purple-600 grid place-items-center text-2xl">👑</div><div><h1 class="text-2xl font-black text-rose-300">RubyChan AI Owner Portal</h1><p class="text-xs text-slate-400">Live Supabase Master Control Center</p></div></div><div class="flex gap-2 items-center"><span id="state" class="pill bg-amber-950 text-amber-300">● Locked</span><button class="btn dark" onclick="login()">Login</button><button class="btn dark" onclick="logout()">Logout</button></div></header><nav id="tabs" class="flex flex-wrap gap-2 border-b border-rose-900/30 pb-3"></nav><section id="app"></section></main><div id="modal"></div><script>
const BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';let key=sessionStorage.getItem('ruby_owner_key')||'';let tab='stats';const tabs=[['stats','📊 Stats'],['users','👥 Users'],['characters','🎭 Characters'],['chats','💬 Chat History'],['premium','👑 Premium'],['broadcast','📣 Broadcast'],['logs','🧾 Logs'],['support','🎫 Support'],['config','⚙️ Config']];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json','x-admin-key':key};const r=await fetch(BASE+p,o),d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function open(html){document.getElementById('modal').innerHTML=`<div><div class="card rounded-2xl p-6">${html}</div></div>`}function close(){document.getElementById('modal').innerHTML=''}function login(){const p=prompt('Owner password');if(!p)return;fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})}).then(async r=>{const d=await r.json();if(!d.success)throw Error('Invalid owner password');key=d.adminKey;sessionStorage.setItem('ruby_owner_key',key);online();render()}).catch(e=>alert(e.message))}function logout(){sessionStorage.removeItem('ruby_owner_key');key='';location.reload()}function online(){document.getElementById('state').textContent='● Online';document.getElementById('state').className='pill bg-emerald-950 text-emerald-300'}function nav(){document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="btn ${tab===x[0]?'on':'dark'}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}const card=(a,b,c)=>`<div class="card rounded-2xl p-5"><div class="text-xs text-slate-400">${a}</div><div class="text-2xl font-black mt-1">${esc(b)}</div><div class="text-[10px] text-slate-500 mt-1">${c}</div></div>`;
async function render(){nav();const a=document.getElementById('app');a.innerHTML='<div class="card rounded-2xl p-10 text-center text-slate-400">Loading…</div>';try{if(tab==='stats')return stats();if(tab==='users')return users();if(tab==='characters')return chars();if(tab==='chats')return chats();if(tab==='premium')return premium();if(tab==='broadcast')return broadcast();if(tab==='logs')return logs();if(tab==='support')return support();return config()}catch(e){a.innerHTML=`<div class="card rounded-2xl p-6 text-red-300">Owner API Error: ${esc(e.message)}</div>`}}
async function stats(){const d=await api('/stats'),s=d.stats;a.innerHTML='';}
async function stats(){const d=await api('/stats'),s=d.stats;app.innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-6 gap-4">${card('Users',s.totalUsers,'Members')}${card('Characters',s.activeCharacters,'Directory')}${card('Conversations',s.totalConversations,'Threads')}${card('Tickets',s.openTickets,'Open')}${card('Energy',s.totalEnergy,'Global')}${card('Gems',s.totalGems,'Global')}</div>`}
async function users(){const d=await api('/users?limit=200');app.innerHTML=`<div class="card rounded-2xl overflow-auto"><div class="p-4 flex justify-between items-center"><b>Users (${d.total||0})</b><input id="uq" class="inp max-w-sm" placeholder="Search" onkeydown="if(event.key==='Enter')findUsers()"></div><table class="w-full text-xs"><thead><tr class="text-slate-500"><th class="p-3 text-left">User</th><th>Plan</th><th>Energy</th><th>Gems</th><th>Status</th><th>Control</th></tr></thead><tbody>${(d.users||[]).map(u=>`<tr class="border-t border-rose-900/20"><td class="p-3"><b>${esc(u.username||u.first_name||u.id)}</b><div class="text-[10px] text-slate-500">${esc(u.id)}</div></td><td>${esc(u.plan||'free')}</td><td>⚡${u.energy??0}</td><td>💎${u.gems??0}</td><td>${esc(u.status||'active')}</td><td><button class="btn dark" onclick='editUser(${JSON.stringify(u)})'>Edit</button> <button class="btn dark" onclick='userHistory(${JSON.stringify(u)})'>History</button></td></tr>`).join('')}</tbody></table></div>`}async function findUsers(){const q=document.getElementById('uq').value;const d=await api('/users?limit=200&q='+encodeURIComponent(q));app.innerHTML='';const rows=d.users||[];app.innerHTML=`<div class="card rounded-2xl overflow-auto p-4"><button class="btn dark" onclick="users()">Back</button><p class="my-3">${d.total||0} results</p><table class="w-full text-xs"><tbody>${rows.map(u=>`<tr class="border-t border-rose-900/20"><td class="p-3">${esc(u.username||u.id)}</td><td>⚡${u.energy??0}</td><td>💎${u.gems??0}</td><td><button class="btn dark" onclick='editUser(${JSON.stringify(u)})'>Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function editUser(u){open(`<h2 class="text-xl font-black">Edit User</h2><p class="text-xs text-slate-400 mt-1">${esc(u.username||u.id)}</p><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="ed" class="inp" type="number" value="0" placeholder="Energy +/-"><input id="gd" class="inp" type="number" value="0" placeholder="Gems +/-"></div><select id="ust" class="inp mt-3"><option ${u.status==='active'?'selected':''}>active</option><option ${u.status==='suspended'?'selected':''}>suspended</option><option ${u.status==='banned'?'selected':''}>banned</option></select><div class="flex gap-2 mt-3"><button class="btn on" onclick="saveUser('${esc(u.id)}')">Save</button><button class="btn dark" onclick="vipUser('${esc(u.id)}')">VIP</button><button class="btn dark" onclick="userHistory(${JSON.stringify(u)})">Chat History</button><button class="btn dark" onclick="close()">Close</button></div>`)}async function saveUser(id){await api('/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number(ed.value||0),gemsDelta:Number(gd.value||0)})});await api('/users/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:ust.value})});close();users()}async function vipUser(id){const action=prompt('grant or revoke','grant');if(!action)return;const days=prompt('VIP days','30');await api('/users/'+encodeURIComponent(id)+'/grant-vip',{method:'POST',body:JSON.stringify({action,planId:'1month',days:Number(days||30)})});alert('VIP updated')}async function userHistory(u){const d=await api('/users?limit=200&q='+encodeURIComponent(u.id));open(`<h2 class="text-xl font-black">${esc(u.username||u.id)} — User</h2><p class="text-xs text-slate-400 mt-1">Select a character from this user's conversations below.</p><div class="space-y-2 mt-4">${(await api('/chats')).conversations.filter(c=>c.user_id===u.id).map(c=>`<button class="card rounded-xl p-3 w-full text-left" onclick="showChat('${encodeURIComponent(c.user_id)}','${encodeURIComponent(c.character_id)}','${esc(c.character_id)}')">💬 ${esc(c.character_id)} <span class="text-[10px] text-slate-500">${esc(c.updated_at||'')}</span></button>`).join('')||'<div class="text-slate-500 text-xs">No conversation records.</div>'}</div>`)}async function showChat(uid,cid,title){const d=await api('/chat-logs/'+uid+'/'+cid);open(`<div class="flex justify-between"><h2 class="text-xl font-black">Chat History: ${title}</h2><button class="btn dark" onclick="close()">Close</button></div><div class="space-y-2 mt-4">${(d.messages||[]).map(m=>`<div class="p-3 rounded-xl ${m.sender==='user'?'bg-purple-950/40':'bg-rose-950/30'}"><div class="text-[10px] text-slate-500">${esc(m.sender)} • ${esc(m.created_at||'')}</div><div class="text-sm mt-1 whitespace-pre-wrap">${esc(m.text||'')}</div>${m.image_url?`<img src="${esc(m.image_url)}" class="mt-2 rounded-xl max-h-72">`:''}</div>`).join('')||'<div class="text-slate-500">No messages</div>'}</div>`)}
async function chars(){const d=await api('/characters');app.innerHTML=`<div class="flex justify-between mb-3"><b>Characters (${(d.characters||[]).length})</b><button class="btn on" onclick="editChar()">+ New Character</button></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${(d.characters||[]).map(c=>`<div class="card rounded-2xl p-4"><div class="flex gap-3"><img src="${esc(c.avatar||'')}" class="w-16 h-16 rounded-2xl object-cover bg-slate-900"><div><b>${esc(c.name)}</b><div class="text-[11px] text-rose-300">${esc(c.title||'')}</div><div class="text-[10px] text-slate-400 mt-1 line-clamp-3">${esc(c.personality||'')}</div></div></div><div class="flex gap-2 mt-4"><button class="btn on" onclick='editChar(${JSON.stringify(c)})'>Edit</button><button class="btn dark" onclick='cloneChar(${JSON.stringify(c.id)})'>Clone</button><button class="btn danger" onclick='delChar(${JSON.stringify(c.id)})'>Delete</button></div></div>`).join('')}</div>`}function editChar(c={}){open(`<h2 class="text-xl font-black">${c.id?'Edit Character':'Create Character'}</h2><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="cid" class="inp" placeholder="ID" value="${esc(c.id||'')}"><input id="cn" class="inp" placeholder="Name" value="${esc(c.name||'')}"><input id="ct" class="inp" placeholder="Title" value="${esc(c.title||'')}"><input id="ca" class="inp" placeholder="Avatar URL" value="${esc(c.avatar||'')}"><input id="cc" class="inp" placeholder="Category" value="${esc(c.category||'Anime')}"><input id="cv" class="inp" placeholder="Voice" value="${esc(c.voice_name||c.voiceName||'Kore')}"></div><textarea id="cp" class="inp mt-3" rows="4" placeholder="Personality">${esc(c.personality||'')}</textarea><textarea id="cb" class="inp mt-3" rows="4" placeholder="Background / Backstory">${esc(c.background||'')}</textarea><textarea id="cg" class="inp mt-3" rows="3" placeholder="Greeting">${esc(c.greeting||'')}</textarea><textarea id="cs" class="inp mt-3" rows="5" placeholder="System Prompt">${esc(c.system_prompt||c.systemPrompt||'')}</textarea><label class="flex gap-2 items-center mt-3 text-xs"><input id="cprem" type="checkbox" ${c.is_premium||c.isPremium?'checked':''}> Premium Character</label><div class="flex gap-2 mt-4"><button class="btn on" onclick="saveChar()">Save Character</button><button class="btn dark" onclick="close()">Cancel</button></div>`)}async function saveChar(){const payload={id:cid.value||undefined,name:cn.value,title:ct.value,avatar:ca.value,category:cc.value,personality:cp.value,background:cb.value,greeting:cg.value,systemPrompt:cs.value,voiceName:cv.value,isPremium:cprem.checked,isActive:true};const d=await api('/characters',{method:'POST',body:JSON.stringify(payload)});close();chars();}async function cloneChar(id){await api('/characters/'+encodeURIComponent(id)+'/duplicate',{method:'POST',body:'{}'});chars()}async function delChar(id){if(!confirm('Delete this character?'))return;await api('/characters/'+encodeURIComponent(id),{method:'DELETE'});chars()}
async function chats(){const d=await api('/chats');app.innerHTML=`<div class="card rounded-2xl p-4"><div class="flex justify-between"><b>All Conversations</b><button class="btn dark" onclick="chats()">Refresh</button></div><div class="space-y-2 mt-3">${(d.conversations||[]).map(c=>`<button class="w-full text-left p-3 bg-[#12071f] rounded-xl" onclick="showChat('${encodeURIComponent(c.user_id)}','${encodeURIComponent(c.character_id)}','${esc(c.character_id)}')"><b>${esc(c.user_id)}</b> → ${esc(c.character_id)}<div class="text-[10px] text-slate-500">${esc(c.updated_at||'')}</div></button>`).join('')||'<div class="text-slate-500">No conversations</div>'}</div></div>`}
async function premium(){const d=await api('/premium');app.innerHTML=`<div class="card rounded-2xl overflow-auto p-4"><b>Premium / VIP Entitlements</b><table class="w-full mt-3 text-xs"><tbody>${(d.entitlements||[]).map(e=>`<tr class="border-t border-rose-900/20"><td class="p-3">${esc(e.user_id)}</td><td>${esc(e.plan_id)}</td><td>${esc(e.status)}</td><td>${esc(e.expiration_date||'')}</td></tr>`).join('')}</tbody></table></div>`}
async function broadcast(){app.innerHTML=`<div class="card rounded-2xl p-6 max-w-2xl"><b>Telegram Broadcast</b><textarea id="bm" class="inp mt-4" rows="7" placeholder="Message to all Telegram members"></textarea><button class="btn on mt-3" onclick="sendBroadcast()">Send Broadcast</button></div>`}async function sendBroadcast(){const msg=bm.value.trim();if(!msg)return;const d=await api('/broadcast',{method:'POST',body:JSON.stringify({message:msg})});alert(`Sent ${d.successCount||0} / ${d.totalTargeted||0}`)}
async function logs(){const [e,g,a]=await Promise.all([api('/logs/energy'),api('/logs/gems'),api('/audit')]);app.innerHTML=`<div class="grid lg:grid-cols-3 gap-4"><div class="card rounded-2xl p-4"><b>Energy Logs</b><div class="space-y-2 mt-3">${(e.logs||[]).slice(0,50).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${esc(x.user_id)} • ${esc(x.amount)} • ${esc(x.action||'')}</div>`).join('')}</div></div><div class="card rounded-2xl p-4"><b>Gems Logs</b><div class="space-y-2 mt-3">${(g.logs||[]).slice(0,50).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${esc(x.user_id)} • ${esc(x.amount)} • ${esc(x.action||'')}</div>`).join('')}</div></div><div class="card rounded-2xl p-4"><b>Audit Logs</b><div class="space-y-2 mt-3">${(a.auditLogs||[]).slice(0,50).map(x=>`<div class="text-xs border-b border-rose-900/20 pb-2">${esc(x.action)} • ${esc(x.target_id||'')}</div>`).join('')}</div></div></div>`}
async function support(){const d=await api('/support');app.innerHTML=`<div class="card rounded-2xl p-4"><b>Support Tickets</b><div class="space-y-2 mt-3">${(d.tickets||[]).map(t=>`<div class="p-3 bg-[#12071f] rounded-xl flex flex-wrap justify-between gap-2"><div><b>${esc(t.subject||'Support')}</b><div class="text-xs text-slate-400">${esc(t.message||'')}</div></div><select class="inp max-w-[150px]" onchange="ticket('${esc(t.id)}',this.value)"><option ${t.status==='open'?'selected':''}>open</option><option ${t.status==='pending'?'selected':''}>pending</option><option ${t.status==='closed'?'selected':''}>closed</option></select></div>`).join('')||'<div class="text-slate-500">No tickets</div>'}</div></div>`}async function ticket(id,status){await api('/support/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({status})})}
async function config(){const d=await api('/config');app.innerHTML=`<div class="card rounded-2xl p-6"><b>System Config</b><div class="grid md:grid-cols-2 gap-3 mt-4">${Object.entries(d.config||{}).map(([k,v])=>`<div class="p-3 bg-[#12071f] rounded-xl"><div class="text-[10px] text-slate-500">${esc(k)}</div><div class="text-sm font-bold">${esc(v)}</div></div>`).join('')}</div><p class="text-xs text-slate-500 mt-4">Live configuration controls can be wired to persistent settings next.</p></div>`}if(key)online();render();</script></body></html>
