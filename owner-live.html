<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RubyChan Owner Control Center</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b0514;color:#f1f5f9;font-family:system-ui}.card{background:#180b28cc;backdrop-filter:blur(14px);border:1px solid #e11d4833}.btn{padding:.55rem .8rem;border-radius:12px;font-size:12px;font-weight:800}.on{background:#e11d48;color:#fff}.dark{background:#160b25;border:1px solid #3f244f;color:#cbd5e1}.inp{background:#12071f;border:1px solid #3f244f;color:#fff;border-radius:12px;padding:.65rem;width:100%}.pill{font-size:10px;border-radius:999px;padding:.2rem .5rem}</style></head><body class="p-4 md:p-8"><main class="max-w-7xl mx-auto space-y-5"><header class="card rounded-2xl p-6 flex flex-wrap justify-between gap-4"><div class="flex gap-4 items-center"><div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-purple-600 grid place-items-center text-2xl">👑</div><div><h1 class="text-2xl font-black text-rose-300">RubyChan AI Owner Portal</h1><p class="text-xs text-slate-400">Live Supabase Control Center</p></div></div><div class="flex gap-2 items-center"><span id="state" class="pill bg-amber-950 text-amber-300">● Locked</span><button class="btn dark" onclick="login()">Login</button></div></header><nav id="tabs" class="flex flex-wrap gap-2 border-b border-rose-900/30 pb-3"></nav><section id="app"></section></main><script>
const BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-admin';let key=sessionStorage.getItem('ruby_owner_key')||'';let tab='stats';const tabs=[['stats','📊 Platform Stats'],['users','👥 Users'],['characters','🎭 Characters'],['chats','💬 Chats'],['premium','👑 Premium'],['config','⚙️ Config']];const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json','x-admin-key':key};const r=await fetch(BASE+p,o),d=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}async function login(){const p=prompt('Owner password');if(!p)return;key=p;const r=await fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})});const d=await r.json();if(!d.success){key='';return alert('Invalid owner password')}sessionStorage.setItem('ruby_owner_key',key);document.getElementById('state').textContent='● Online';document.getElementById('state').className='pill bg-emerald-950 text-emerald-300';render()}function nav(){document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="btn ${tab===x[0]?'on':'dark'}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}const card=(a,b,c)=>`<div class="card rounded-2xl p-5"><div class="text-xs text-slate-400">${a}</div><div class="text-2xl font-black mt-1">${b}</div><div class="text-[10px] text-slate-500 mt-1">${c}</div></div>`;async function render(){nav();const a=document.getElementById('app');a.innerHTML='<div class="card rounded-2xl p-10 text-center text-slate-400">Loading…</div>';try{if(tab==='stats'){const d=await api('/stats'),s=d.stats;a.innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-5 gap-4">${card('Users',s.totalUsers,'Registered')}${card('Characters',s.activeCharacters,'Active')}${card('Conversations',s.totalConversations,'Threads')}${card('Tickets',s.openTickets,'Open Support')}${card('Energy',s.totalEnergy,'Total Balance')}</div>`}else if(tab==='users'){const d=await api('/users?limit=100');a.innerHTML=`<div class="card rounded-2xl overflow-auto"><div class="p-4 font-bold">Users (${d.total||0})</div><table class="w-full text-xs"><thead><tr class="text-slate-500"><th class="p-3 text-left">User</th><th class="p-3">Plan</th><th class="p-3">Energy</th><th class="p-3">Gems</th><th class="p-3">Control</th></tr></thead><tbody>${(d.users||[]).map(u=>`<tr class="border-t border-rose-900/20"><td class="p-3">${esc(u.username||u.first_name||u.id)}<div class="text-[10px] text-slate-500">${esc(u.id)}</div></td><td class="p-3">${esc(u.plan||'free')}</td><td class="p-3 text-amber-300">⚡${u.energy??0}</td><td class="p-3 text-rose-300">💎${u.gems??0}</td><td class="p-3"><button class="btn dark" onclick="adjust('${esc(u.id)}')">Balance</button> <button class="btn dark" onclick="vip('${esc(u.id)}')">VIP</button></td></tr>`).join('')}</tbody></table></div>`}else if(tab==='characters'){const d=await api('/characters');a.innerHTML=`<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${(d.characters||[]).map(c=>`<div class="card rounded-2xl p-4 flex gap-3"><img src="${esc(c.avatar||'')}" class="w-14 h-14 rounded-2xl object-cover bg-slate-900"><div><b>${esc(c.name)}</b><div class="text-[11px] text-rose-300">${esc(c.title||'')}</div><div class="text-[10px] text-slate-400 mt-1">${esc(c.personality||'')}</div></div></div>`).join('')}</div>`}else if(tab==='chats'){const d=await api('/chats');a.innerHTML=`<div class="card rounded-2xl p-4"><b>Recent Conversations</b><div class="space-y-2 mt-3">${(d.conversations||[]).map(c=>`<div class="p-3 bg-[#12071f] rounded-xl text-xs">${esc(c.user_id)} → ${esc(c.character_id)}<div class="text-[10px] text-slate-500">${esc(c.updated_at||'')}</div></div>`).join('')||'<div class="text-slate-500">No conversations</div>'}</div></div>`}else if(tab==='premium'){const d=await api('/premium');a.innerHTML=`<div class="card rounded-2xl overflow-auto p-4"><b>Premium Entitlements</b><table class="w-full mt-3 text-xs"><tbody>${(d.entitlements||[]).map(e=>`<tr class="border-t border-rose-900/20"><td class="p-3">${esc(e.user_id)}</td><td class="p-3">${esc(e.plan_id)}</td><td class="p-3">${esc(e.status)}</td><td class="p-3">${esc(e.expiration_date||'')}</td></tr>`).join('')}</tbody></table></div>`}else{const d=await api('/config');a.innerHTML=`<div class="card rounded-2xl p-6"><b>System Config</b><div class="grid md:grid-cols-2 gap-3 mt-4">${Object.entries(d.config||{}).map(([k,v])=>`<div class="p-3 bg-[#12071f] rounded-xl"><div class="text-[10px] text-slate-500">${esc(k)}</div><div class="text-sm font-bold">${esc(v)}</div></div>`).join('')}</div></div>`}}catch(e){a.innerHTML=`<div class="card rounded-2xl p-6 text-red-300">Owner API Error: ${esc(e.message)}</div>`}}async function adjust(id){const e=prompt('Energy +/-', '0');const g=prompt('Gems +/-','0');if(e===null||g===null)return;await api('/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({energyDelta:Number(e),gemsDelta:Number(g)})});render()}async function vip(id){const action=prompt('grant or revoke','grant');if(!action)return;const days=prompt('VIP days','30');await api('/users/'+encodeURIComponent(id)+'/grant-vip',{method:'POST',body:JSON.stringify({action,planId:'1month',days:Number(days||30)})});render()}if(key){document.getElementById('state').textContent='● Online';document.getElementById('state').className='pill bg-emerald-950 text-emerald-300'}render();</script></body></html>
